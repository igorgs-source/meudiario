<div id="app"></div>
<script>
// ── CONSTANTS ─────────────────────────────────────────────────

const SK_PROFILES = 'mdia_profiles';
const SK_APIKEY   = 'mdia_apikey';

  {id:'teal',  label:'Verde',   cor:'#13B6A4',grad:'linear-gradient(135deg,#0A1F1D,#0D5E56,#13B6A4)'},

const EMOJIS = ['👨','👩','🧑','👦','👧','🧔','👴','👵','🧒','🙋','🙍','🧑‍⚕️','🧑‍💼','🧑‍🔬','🏃','🧘'];
const ROTEIRO = {
  manha:['Como você dormiu? Teve dificuldade pra pegar no sono ou acordou durante a noite?','Como seu corpo está agora — alguma dor, tensão ou sintoma ao acordar?','Qual é o seu humor neste momento? Animado, cansado, ansioso?','Tem algo que está na sua cabeça logo de manhã?'],

};
const HUMORES    = ['😔','😐','🙂','😄','🤩'];
const HUMOR_LBL  = ['difícil','neutro','bem','ótimo','eufórico'];
const ALIM_OPTS  = ['ruim','regular','boa','ótima'];
const SONO_OPTS  = ['péssima','ruim','ok','boa','ótima'];
const C = {
  bg:'#0D0D1A',sf:'rgba(255,255,255,0.04)',bd:'rgba(255,255,255,0.08)',
  text:'#E8E6F0',muted:'rgba(255,255,255,0.4)',faint:'rgba(255,255,255,0.22)',
  red:'#C4404A',lav:'#C4A8FF',gradRec:'linear-gradient(135deg,#7A1A1A,#C4404A)',
};

// ── STORAGE ───────────────────────────────────────────────────
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}
function loadProfiles(){try{return JSON.parse(lsGet(SK_PROFILES)||'[]')}catch{return[]}}
function saveProfiles(l){lsSet(SK_PROFILES,JSON.stringify(l))}
function loadCheckins(id){try{return JSON.parse(lsGet(SK_CHECKINS(id))||'[]')}catch{return[]}}
function saveCheckins(id,l){lsSet(SK_CHECKINS(id),JSON.stringify(l))}
function getApiKey(){return lsGet(SK_APIKEY)||''}
function setApiKey(k){return lsSet(SK_APIKEY,k)}

// ── HELPERS ───────────────────────────────────────────────────
const today   = () => new Date().toISOString().split('T')[0];
const fmtDate = iso => new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
const wday    = iso => new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const fmtSec  = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const uid     = () => Math.random().toString(36).slice(2,9);
const getPal  = id => PALETTE.find(p=>p.id===id)||PALETTE[0];

// ── API ───────────────────────────────────────────────────────
async function callClaude(prompt){
  const key=getApiKey();
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]}),
  });
  const d=await res.json();
  if(d.error) throw new Error(d.error.message);
  return d.content?.[0]?.text||'';
}

// ── PROMPTS ───────────────────────────────────────────────────
function buildExtractor(text,momento,extras){
  const lines=[
    extras.sono_horas?`Sono: ${extras.sono_horas}h`:'',
    extras.sono_q?`Qualidade sono: ${extras.sono_q}/5`:'',
    extras.energia_i?`Energia início: ${extras.energia_i}/5`:'',
    extras.energia_f?`Energia fim: ${extras.energia_f}/5`:'',
    extras.humor?`Humor: ${extras.humor}`:'',
    extras.alim?`Alimentação: ${extras.alim}`:'',
    extras.sintoma?`Sintoma: ${extras.sintoma}`:'',
  ].filter(Boolean).join('\n');
  return `Você é um extrator silencioso de dados de saúde do app meudIArio.
Analise o relato e retorne APENAS JSON válido, sem explicações, sem markdown.
Contexto: check-in de ${momento==='manha'?'MANHÃ':'NOITE'}
Relato: "${text}"
${lines}
Retorne exatamente (null para não mencionado):
{"sono_horas":null,"sono_qualidade":null,"energia_inicio":null,"energia_fim":null,"humor":null,"sintomas":[],"alimentacao":null,"hidratacao":null,"nota_livre":null,"contexto_momento":"${momento}"}`;
}

function detectPadroes(hist){
  if(hist.length<3)return null;
  const p=[];
  const en=hist.filter(h=>h.dados?.energia_fim??h.dados?.energia_inicio).map(h=>h.dados?.energia_fim??h.dados?.energia_inicio);
  if(en.length>=3){const m=en.reduce((a,b)=>a+b,0)/en.length,r=en.slice(-2).reduce((a,b)=>a+b,0)/2;if(r<m-.5)p.push('Energia abaixo da média');if(r>m+.5)p.push('Energia acima da média');}
  const sn=hist.filter(h=>h.dados?.sono_horas).map(h=>h.dados.sono_horas);
  if(sn.length>=3){const m=sn.reduce((a,b)=>a+b,0)/sn.length;if(m<6.5)p.push(`Sono médio baixo (${m.toFixed(1)}h)`);}
  const fr={};hist.flatMap(h=>h.dados?.sintomas||[]).forEach(s=>{fr[s]=(fr[s]||0)+1;});
  Object.entries(fr).forEach(([s,n])=>{if(n>=2)p.push(`"${s}" recorrente`);});
  return p.join('; ')||null;
}

function buildInsight(dados,hist,nome,momento){
  const h=hist.length>0?hist.map(d=>`${fmtDate(d.data)} (${d.momento}): ${JSON.stringify(d.dados)}`).join('\n'):'Primeiro registro.';
  const pad=detectPadroes(hist);
  return `Você é o meudIArio — companheiro de saúde de ${nome}.
Use todos os dados. Não mencione nenhum dado explicitamente.
MOMENTO: ${momento==='manha'?'MANHÃ (como acordou, sono, estado inicial)':'NOITE (saldo do dia, variação de energia, como está agora)'}
DADOS HOJE: ${JSON.stringify(dados)}
HISTÓRICO: ${h}
PADRÕES (interno): ${pad||'Poucos dados.'}
REGRAS: máximo 3 frases · nunca liste dados ou métricas · nunca diga "detectamos" · nunca seja genérico ou clichê · fale como quem conhece essa pessoa há meses · se houver padrão, insinue com leveza · uma pergunta só se fizer sentido real · responda direto, sem introdução.`;
}

function buildAnalise(checkins,nome){
  return `Você é o meudIArio. Analise os registros de ${nome} e gere uma reflexão — algo que a pessoa não perceberia sozinha.
REGISTROS: ${checkins.map(d=>`${fmtDate(d.data)} (${d.momento}): ${JSON.stringify(d.dados)}`).join('\n')}
REGRAS: 3 a 5 frases · nunca mencione dados técnicos · revele padrão de forma humana · termine com pergunta genuína · seja específico.`;
}

// ── VOICE ─────────────────────────────────────────────────────
let recognition=null,recTimer=null,accumulated='',recSec=0;
const voiceOK='SpeechRecognition' in window||'webkitSpeechRecognition' in window;

function startRec(onUpdate,onErr){
  if(!voiceOK){onErr('Use Chrome ou Safari para gravar voz.');return;}
  accumulated='';
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='pt-BR';recognition.continuous=true;recognition.interimResults=true;
  recognition.onresult=e=>{
    let fi='',in_='';
    for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fi+=t+' ';else in_+=t;}
    if(fi)accumulated+=fi;
    onUpdate((accumulated+in_).trim(),!!in_);
  };
  recognition.onerror=e=>{if(e.error!=='no-speech')onErr('Verifique a permissão do microfone.');};
  recognition.onend=()=>{if(recognition){onUpdate(accumulated.trim(),false);recognition=null;clearInterval(recTimer);}};
  recognition.start();
  recSec=0;recTimer=setInterval(()=>{recSec++;},1000);
}
function stopRec(onUpdate){
  if(recognition){recognition.stop();recognition=null;}
  clearInterval(recTimer);
  if(onUpdate)onUpdate(accumulated.trim(),false);
}
function resetRec(){
  if(recognition){recognition.stop();recognition=null;}
  clearInterval(recTimer);accumulated='';recSec=0;
}

// ── ROUTER ────────────────────────────────────────────────────
// screens: setup | select | newprofile | app
let currentScreen='setup';
let currentProfile=null;

function navigate(screen,profile){
  currentScreen=screen;
  currentProfile=profile||null;
  renderScreen();
}

function renderScreen(){
  const app=document.getElementById('app');
  app.innerHTML='';
  if(currentScreen==='setup')     app.appendChild(buildSetup());
  else if(currentScreen==='select')   app.appendChild(buildSelect());
  else if(currentScreen==='newprofile') app.appendChild(buildNewProfile());
  else if(currentScreen==='app')   app.appendChild(buildApp(currentProfile));
}

// ── SCREEN: SETUP ─────────────────────────────────────────────
function buildSetup(){
  const wrap=el('div',{style:{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px'}});
  wrap.appendChild(buildLogo('configure para começar'));

  const card=el('div',{style:{width:'100%',maxWidth:'380px',background:C.sf,border:`1px solid ${C.bd}`,borderRadius:'20px',padding:'28px 24px',display:'flex',flexDirection:'column',gap:'16px'}});

  card.appendChild(el('p',{style:{fontSize:'13px',color:C.muted,lineHeight:'1.6'}},'Para funcionar, o app precisa de uma ',el('strong',{style:{color:C.lav}},'API Key da Anthropic'),'. Ela fica salva só neste dispositivo.'));

  // API key input — NÃO usa setState, atualiza diretamente
  const keyWrap=el('div',{style:{position:'relative'}});
  const keyInput=el('input',{
    type:'password',
    placeholder:'sk-ant-...',
    style:{width:'100%',background:'rgba(255,255,255,0.07)',border:`1px solid ${C.bd}`,borderRadius:'10px',padding:'12px 44px 12px 14px',color:C.text,fontSize:'16px',outline:'none',boxSizing:'border-box'},
  });
  keyInput.value=getApiKey();

  let showKey=false;
  const eyeBtn=el('button',{
    style:{position:'absolute',right:'12px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:C.faint,fontSize:'18px',padding:'4px',lineHeight:'1'},
  },'👁');
  eyeBtn.addEventListener('click',()=>{
    showKey=!showKey;
    keyInput.type=showKey?'text':'password';
    eyeBtn.textContent=showKey?'🙈':'👁';
  });
  keyWrap.appendChild(keyInput);
  keyWrap.appendChild(eyeBtn);

  const keySection=el('div',{});
  keySection.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'8px',fontFamily:'monospace',letterSpacing:'0.06em',textTransform:'uppercase'}},'API Key'));
  keySection.appendChild(keyWrap);
  card.appendChild(keySection);

  card.appendChild(el('p',{style:{fontSize:'11px',color:C.faint,lineHeight:'1.5'}},'Acesse ',el('strong',{},'console.anthropic.com'),' → Settings → API Keys → Create Key'));

  const saveBtn=el('button',{
    style:{padding:'13px 0',borderRadius:'12px',border:'none',background:'linear-gradient(135deg,#4A2D8A,#9B6FE8)',color:'#fff',fontSize:'15px',fontWeight:'600',width:'100%'},
  },'salvar e começar');
  saveBtn.addEventListener('click',()=>{
    const k=keyInput.value.trim();
    if(!k){alert('Cole sua API key para continuar.');return;}
    const ok=setApiKey(k);
    if(!ok){alert('Erro ao salvar. Tente novamente.');}
    else navigate('select');
  });
  card.appendChild(saveBtn);

  const hasKey=!!getApiKey();
  if(hasKey){
    const skipBtn=el('button',{
      style:{padding:'10px 0',borderRadius:'12px',border:`1px solid ${C.bd}`,background:'transparent',color:C.faint,fontSize:'13px',width:'100%'},
    },'já configurado — continuar →');
    skipBtn.addEventListener('click',()=>navigate('select'));
    card.appendChild(skipBtn);
  }

  wrap.appendChild(card);
  return wrap;
}

// ── SCREEN: SELECT ────────────────────────────────────────────
function buildSelect(){
  const profiles=loadProfiles();
  const wrap=el('div',{style:{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px 20px'}});
  wrap.appendChild(buildLogo('quem está fazendo o check-in?'));

  const cols=profiles.length===1?'1fr':profiles.length===2?'1fr 1fr':'repeat(auto-fill,minmax(130px,1fr))';
  const grid=el('div',{style:{width:'100%',maxWidth:'460px',display:'grid',gridTemplateColumns:cols,gap:'12px'}});

  profiles.forEach(p=>{
    const pal=getPal(p.cor);
    const count=loadCheckins(p.id).length;
    const btn=el('button',{style:{padding:'22px 12px',borderRadius:'18px',border:`1.5px solid ${pal.cor}44`,background:`${pal.cor}0D`,display:'flex',flexDirection:'column',alignItems:'center',gap:'10px',transition:'all 0.2s'}});
    btn.appendChild(el('div',{style:{fontSize:'44px',lineHeight:'1'}},p.emoji));
    btn.appendChild(el('div',{style:{fontSize:'16px',fontWeight:'600',color:pal.cor}},p.nome));
    btn.appendChild(el('div',{style:{fontSize:'10px',color:C.faint,fontFamily:'monospace'}},`${count} registro${count!==1?'s':''}`));
    btn.addEventListener('click',()=>navigate('app',p));
    grid.appendChild(btn);
  });

  // Botão novo perfil
  const addBtn=el('button',{style:{padding:'22px 12px',borderRadius:'18px',border:`1.5px dashed ${C.bd}`,background:'transparent',display:'flex',flexDirection:'column',alignItems:'center',gap:'10px',color:C.faint}});
  addBtn.appendChild(el('div',{style:{fontSize:'32px',lineHeight:'1'}},'+'));
  addBtn.appendChild(el('div',{style:{fontSize:'13px'}},'novo perfil'));
  addBtn.addEventListener('click',()=>navigate('newprofile'));
  grid.appendChild(addBtn);
  wrap.appendChild(grid);

  const cfgBtn=el('button',{style:{marginTop:'20px',background:'transparent',border:'none',color:C.faint,fontSize:'11px',fontFamily:'monospace',letterSpacing:'0.06em'}},'⚙ alterar API key');
  cfgBtn.addEventListener('click',()=>navigate('setup'));
  wrap.appendChild(cfgBtn);
  return wrap;
}

// ── SCREEN: NEW PROFILE ───────────────────────────────────────
function buildNewProfile(){
  // Estado local sem setState — tudo direto no DOM
  let npNome='',npEmoji='👤',npCor='violet';

  const wrap=el('div',{style:{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px 20px'}});
  wrap.appendChild(buildLogo('novo perfil'));

  const card=el('div',{style:{width:'100%',maxWidth:'380px',background:C.sf,border:`1px solid ${C.bd}`,borderRadius:'20px',padding:'28px 24px',display:'flex',flexDirection:'column',gap:'20px'}});

  // Preview (atualiza sem rerender)
  const previewEmoji=el('div',{style:{fontSize:'40px',lineHeight:'1'}},'👤');
  const previewNome=el('div',{style:{fontSize:'20px',fontWeight:'700',color:getPal('violet').cor}},'Nome');
  const preview=el('div',{style:{display:'flex',alignItems:'center',gap:'14px',padding:'16px',background:`${getPal('violet').cor}0D`,border:`1px solid ${getPal('violet').cor}30`,borderRadius:'14px'}});
  preview.appendChild(previewEmoji);
  const previewMeta=el('div',{});
  previewMeta.appendChild(previewNome);
  previewMeta.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginTop:'2px',fontFamily:'monospace'}},'novo perfil'));
  preview.appendChild(previewMeta);
  card.appendChild(preview);

  function updatePreview(){
    const pal=getPal(npCor);
    previewEmoji.textContent=npEmoji;
    previewNome.textContent=npNome||'Nome';
    previewNome.style.color=pal.cor;
    preview.style.background=`${pal.cor}0D`;
    preview.style.border=`1px solid ${pal.cor}30`;
  }

  // Nome — input direto, sem rerender
  const nomeSection=el('div',{});
  nomeSection.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'8px',fontFamily:'monospace',letterSpacing:'0.06em',textTransform:'uppercase'}},'nome'));
  const nomeInput=el('input',{
    type:'text',
    placeholder:'ex: Igor, Maria…',
    style:{width:'100%',background:'rgba(255,255,255,0.07)',border:`1px solid ${C.bd}`,borderRadius:'10px',padding:'12px 14px',color:C.text,fontSize:'16px',outline:'none',boxSizing:'border-box'},
  });
  nomeInput.addEventListener('input',e=>{npNome=e.target.value;updatePreview();});
  nomeSection.appendChild(nomeInput);
  card.appendChild(nomeSection);

  // Emoji
  const emojiSection=el('div',{});
  emojiSection.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'8px',fontFamily:'monospace',letterSpacing:'0.06em',textTransform:'uppercase'}},'emoji'));
  const emojiGrid=el('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px'}});
  const emojiBtns={};
  EMOJIS.forEach(e=>{
    const b=el('button',{style:{padding:'6px',borderRadius:'8px',border:`1px solid ${C.bd}`,background:'transparent',fontSize:'22px',lineHeight:'1',transition:'all 0.15s'}},e);
    b.addEventListener('click',()=>{
      npEmoji=e;
      Object.values(emojiBtns).forEach(x=>{x.style.border=`1px solid ${C.bd}`;x.style.background='transparent';});
      b.style.border=`1px solid ${getPal(npCor).cor}`;b.style.background=`${getPal(npCor).cor}20`;
      updatePreview();
    });
    emojiBtns[e]=b;
    emojiGrid.appendChild(b);
  });
  emojiSection.appendChild(emojiGrid);
  card.appendChild(emojiSection);

  // Cor
  const corSection=el('div',{});
  corSection.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'8px',fontFamily:'monospace',letterSpacing:'0.06em',textTransform:'uppercase'}},'cor'));
  const corGrid=el('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px'}});
  const corBtns={};
  PALETTE.forEach(p=>{
    const b=el('button',{
      style:{width:'36px',height:'36px',borderRadius:'50%',border:`2px solid ${p.id==='violet'?'#fff':p.cor+'44'}`,background:p.cor,boxShadow:p.id==='violet'?`0 0 0 3px ${p.cor}66`:'none',transition:'all 0.15s'},
      title:p.label,
    });
    b.addEventListener('click',()=>{
      npCor=p.id;
      Object.values(corBtns).forEach(x=>{x.style.border=`2px solid ${x._cor}44`;x.style.boxShadow='none';});
      b.style.border='2px solid #fff';b.style.boxShadow=`0 0 0 3px ${p.cor}66`;
      updatePreview();
      // Atualiza bordas dos emoji btns selecionado
      if(emojiBtns[npEmoji]){
        Object.values(emojiBtns).forEach(x=>{x.style.border=`1px solid ${C.bd}`;x.style.background='transparent';});
        emojiBtns[npEmoji].style.border=`1px solid ${p.cor}`;emojiBtns[npEmoji].style.background=`${p.cor}20`;
      }
    });
    b._cor=p.cor;
    corBtns[p.id]=b;
    corGrid.appendChild(b);
  });
  // Marca violeta como selecionado por padrão
  corBtns['violet'].style.border='2px solid #fff';corBtns['violet'].style.boxShadow=`0 0 0 3px ${getPal('violet').cor}66`;
  corSection.appendChild(corGrid);
  card.appendChild(corSection);

  // Botões
  const btnRow=el('div',{style:{display:'flex',gap:'10px'}});
  const cancelBtn=el('button',{style:{flex:'1',padding:'12px 0',borderRadius:'12px',border:`1px solid ${C.bd}`,background:'transparent',color:C.faint,fontSize:'14px'}},'cancelar');
  cancelBtn.addEventListener('click',()=>navigate('select'));
  const createBtn=el('button',{style:{flex:'2',padding:'12px 0',borderRadius:'12px',border:'none',background:'linear-gradient(135deg,#4A2D8A99,#9B6FE8)',color:'#fff',fontSize:'15px',fontWeight:'600'}},'criar perfil');
  createBtn.addEventListener('click',()=>{
    if(!npNome.trim()){alert('Digite um nome para o perfil.');return;}
    const novo={id:uid(),nome:npNome.trim(),emoji:npEmoji,cor:npCor};
    const lista=[...loadProfiles(),novo];
    saveProfiles(lista);
    navigate('select');
  });
  btnRow.appendChild(cancelBtn);btnRow.appendChild(createBtn);
  card.appendChild(btnRow);
  wrap.appendChild(card);
  return wrap;
}

// ── SCREEN: APP ───────────────────────────────────────────────
function buildApp(profile){
  const pal=getPal(profile.cor);
  const cor=pal.cor;

  // Estado local do app — sem setState global
  let checkins=loadCheckins(profile.id);
  let momento='manha';
  let fase='form'; // form|loading|insight|analise|historico
  let insight='',analise='',loadMsg='';
  let texto='',isInterim=false;
  let recStatus='idle',voiceErr='';
  // Campos manhã
  let sono='',sonoQ=0,sintomaManha='';
  // Campos noite
  let enI=0,enF=0,humor=0,alim='',sintomaNoite='';

  const jaFezHoje=m=>checkins.some(c=>c.data===today()&&c.momento===m);

  // Container principal
  const root=el('div',{style:{minHeight:'100vh',background:C.bg,color:C.text}});

  // ── HEADER ──
  const header=el('div',{style:{background:pal.grad,padding:'22px 20px 18px'}});
  const headerInner=el('div',{style:{maxWidth:'460px',margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between'}});

  const logoSide=el('div',{style:{display:'flex',alignItems:'center',gap:'10px'}});
  const avatar=el('div',{style:{width:'38px',height:'38px',borderRadius:'50%',background:`${cor}30`,border:`1.5px solid ${cor}60`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}},profile.emoji);
  const logoText=el('div',{});
  const logoName=el('div',{style:{fontSize:'20px',fontWeight:'700',letterSpacing:'-0.02em',lineHeight:'1'}});
  logoName.innerHTML=`<span style="color:rgba(255,255,255,0.3);font-weight:300">meu</span><span style="color:#fff">d</span><span style="color:${cor}">IA</span><span style="color:#fff">rio</span>`;
  const logoSub=el('div',{style:{fontSize:'10px',color:'rgba(255,255,255,0.28)',marginTop:'3px',fontFamily:'monospace',letterSpacing:'0.08em'}},`${profile.nome.toUpperCase()} · ${checkins.length} registro${checkins.length!==1?'s':''}`);
  logoText.appendChild(logoName);logoText.appendChild(logoSub);
  logoSide.appendChild(avatar);logoSide.appendChild(logoText);

  const navSide=el('div',{style:{display:'flex',gap:'7px'}});
  const btnCheckin=el('button',{style:{borderRadius:'20px',padding:'5px 12px',color:cor,fontSize:'11px',fontWeight:'500',border:`1px solid ${cor}80`,background:`${cor}25`}},'check-in');
  const btnHist=el('button',{style:{borderRadius:'20px',padding:'5px 12px',color:cor,fontSize:'11px',fontWeight:'500',border:`1px solid rgba(255,255,255,0.12)`,background:'transparent'}},'histórico');
  const btnBack=el('button',{style:{borderRadius:'20px',padding:'5px 10px',color:C.faint,fontSize:'11px',border:'1px solid rgba(255,255,255,0.1)',background:'transparent'}},'↩');
  btnCheckin.addEventListener('click',()=>showForm());
  btnHist.addEventListener('click',()=>showHistorico());
  btnBack.addEventListener('click',()=>navigate('select'));
  navSide.appendChild(btnCheckin);navSide.appendChild(btnHist);navSide.appendChild(btnBack);

  headerInner.appendChild(logoSide);headerInner.appendChild(navSide);
  header.appendChild(headerInner);
  root.appendChild(header);

  // ── CONTENT AREA ──
  const content=el('div',{style:{maxWidth:'460px',margin:'0 auto',padding:'20px 18px 60px'}});
  root.appendChild(content);

  function updateNavBtns(activeF){
    btnCheckin.style.background=activeF==='form'||activeF==='insight'?`${cor}25`:'transparent';
    btnCheckin.style.border=`1px solid ${activeF==='form'||activeF==='insight'?`${cor}80`:'rgba(255,255,255,0.12)'}`;
    btnHist.style.background=activeF==='historico'?`${cor}25`:'transparent';
    btnHist.style.border=`1px solid ${activeF==='historico'?`${cor}80`:'rgba(255,255,255,0.12)'}`;
    logoSub.textContent=`${profile.nome.toUpperCase()} · ${checkins.length} registro${checkins.length!==1?'s':''}`;
  }

  // ── FORM ──
  function showForm(){
    fase='form';updateNavBtns('form');
    content.innerHTML='';
    const wrap=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});

    // Toggle manhã/noite
    const toggle=el('div',{style:{display:'flex',gap:'8px'}});
    ['manha','noite'].forEach(m=>{
      const b=el('button',{style:{flex:'1',padding:'12px 0',borderRadius:'12px',fontSize:'14px',fontWeight:'500',transition:'all 0.2s',
        background:momento===m?`${cor}20`:C.sf,
        border:`1.5px solid ${momento===m?cor:C.bd}`,
        color:momento===m?cor:C.muted,
        opacity:jaFezHoje(m)?'0.45':'1',
      }},`${m==='manha'?'🌤 manhã':'🌙 noite'}${jaFezHoje(m)?' ✓':''}`);
      b.addEventListener('click',()=>{momento=m;showForm();});
      toggle.appendChild(b);
    });
    wrap.appendChild(toggle);

    // Roteiro
    const rot=el('div',{style:{background:`${cor}0C`,border:`1px solid ${cor}28`,borderRadius:'14px',padding:'14px 16px'}});
    rot.appendChild(el('div',{style:{fontSize:'10px',color:cor,marginBottom:'10px',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:'monospace'}},momento==='manha'?'roteiro · manhã':'roteiro · noite'));
    ROTEIRO[momento].forEach((q,i)=>{
      const row=el('div',{style:{display:'flex',gap:'10px',marginBottom:i<ROTEIRO[momento].length-1?'8px':'0'}});
      row.appendChild(el('div',{style:{fontSize:'11px',color:`${cor}90`,fontFamily:'monospace',marginTop:'1px',flexShrink:'0'}},`${i+1}.`));
      row.appendChild(el('div',{style:{fontSize:'13px',color:C.muted,lineHeight:'1.55'}},q));
      rot.appendChild(row);
    });
    wrap.appendChild(rot);

    // Painel de voz
    const painelVoz=buildVoicePainel();
    wrap.appendChild(painelVoz);

    // Campos opcionais
    const camposBox=el('div',{style:{background:C.sf,border:`1px solid ${C.bd}`,borderRadius:'14px',padding:'16px'}});
    camposBox.appendChild(el('div',{style:{fontSize:'10px',color:C.faint,marginBottom:'14px',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:'monospace'}},momento==='manha'?'dados da noite':'dados do dia'));
    camposBox.appendChild(momento==='manha'?buildCamposManha():buildCamposNoite());
    wrap.appendChild(camposBox);

    // Botão enviar
    const envBtn=el('button',{style:{padding:'14px 0',borderRadius:'14px',border:'none',background:texto.trim()?`linear-gradient(135deg,${cor}99,${cor})`:'rgba(255,255,255,0.06)',color:texto.trim()?'#fff':C.faint,fontSize:'15px',fontWeight:'600',width:'100%',transition:'all 0.2s'}},'enviar check-in');
    envBtn.addEventListener('click',handleSubmit);
    wrap.appendChild(envBtn);

    // Análise semanal
    if(checkins.length>=4){
      const anBtn=el('button',{style:{padding:'12px 0',borderRadius:'14px',background:`${cor}10`,border:`1px solid ${cor}40`,color:cor,fontSize:'14px',fontWeight:'500',width:'100%'}},`✦ análise da semana · ${checkins.length} registros`);
      anBtn.addEventListener('click',handleAnalise);
      wrap.appendChild(anBtn);
    }

    content.appendChild(wrap);
  }

  // ── PAINEL DE VOZ ──
  function buildVoicePainel(){
    const isRec=recStatus==='recording';
    const panel=el('div',{style:{background:C.sf,border:`1.5px solid ${isRec?'rgba(196,64,74,0.5)':texto?cor+'80':C.bd}`,borderRadius:'18px',padding:'20px 18px',transition:'border-color 0.3s'}});
    panel.appendChild(el('div',{style:{fontSize:'10px',color:C.faint,marginBottom:'18px',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:'monospace'}},momento==='manha'?'como foi a noite e como você acordou?':'como foi o dia?'));

    // Mic button
    const micWrap=el('div',{style:{display:'flex',justifyContent:'center',marginBottom:'10px'}});
    const micBtn=el('button',{style:{width:'80px',height:'80px',borderRadius:'50%',border:'none',cursor:voiceOK?'pointer':'not-allowed',
      background:isRec?C.gradRec:`linear-gradient(135deg,${cor}99,${cor})`,
      boxShadow:isRec?'0 0 0 10px rgba(196,64,74,0.12),0 0 0 20px rgba(196,64,74,0.05)':`0 8px 32px ${cor}66`,
      transition:'all 0.3s',display:'flex',alignItems:'center',justifyContent:'center'}});
    micBtn.innerHTML=isRec
      ?'<svg width="22" height="22" viewBox="0 0 20 20" fill="white"><rect x="3" y="3" width="14" height="14" rx="2.5"/></svg>'
      :'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
    micBtn.addEventListener('click',()=>{
      if(isRec){stopRec(t=>{texto=t;isInterim=false;showForm();});recStatus='idle';}
      else{recStatus='recording';startRec((t,interim)=>{texto=t;isInterim=interim;updateTextoPreview();},err=>{voiceErr=err;recStatus='error';showForm();});}
      showForm();
    });
    micWrap.appendChild(micBtn);
    panel.appendChild(micWrap);

    const micLbl=el('div',{style:{textAlign:'center',fontSize:'12px',color:isRec?C.red:C.muted,fontFamily:'monospace',letterSpacing:'0.06em',height:'18px',marginBottom:'14px'}},isRec?`⏺ gravando`:voiceOK?'toque para gravar':'use o texto abaixo');
    panel.appendChild(micLbl);

    // Preview transcrição
    if(texto||isRec){
      const prev=el('div',{id:'texto-preview',style:{background:`${cor}10`,border:`1px solid ${cor}28`,borderRadius:'12px',padding:'12px 14px',marginBottom:'14px',minHeight:'48px'}});
      prev.appendChild(el('div',{style:{fontSize:'13px',lineHeight:'1.65',color:isInterim?C.muted:C.text,fontStyle:isInterim?'italic':'normal'}},texto||'ouvindo…'));
      panel.appendChild(prev);
    }

    // Separador
    const sep=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
    sep.appendChild(el('div',{style:{flex:'1',height:'1px',background:C.bd}}));
    sep.appendChild(el('span',{style:{fontSize:'10px',color:C.faint,fontFamily:'monospace',letterSpacing:'0.08em'}},'ou escreva'));
    sep.appendChild(el('div',{style:{flex:'1',height:'1px',background:C.bd}}));
    panel.appendChild(sep);

    // Textarea — NÃO reconstrói ao digitar
    const ta=el('textarea',{
      style:{width:'100%',background:'rgba(255,255,255,0.04)',border:`1px solid ${C.bd}`,borderRadius:'10px',padding:'10px 12px',color:C.text,fontSize:'16px',resize:'vertical',outline:'none',lineHeight:'1.6',boxSizing:'border-box'},
      placeholder:momento==='manha'?'fale ou escreva livremente…':'o saldo do dia, como você está agora…',
      rows:'3',
    });
    ta.value=texto;
    ta.addEventListener('input',e=>{texto=e.target.value;isInterim=false;});
    panel.appendChild(ta);

    if(voiceErr) panel.appendChild(el('div',{style:{fontSize:'12px',color:C.red,marginTop:'8px'}},`⚠ ${voiceErr}`));
    return panel;
  }

  function updateTextoPreview(){
    const prev=document.getElementById('texto-preview');
    if(prev){const d=prev.querySelector('div');if(d)d.textContent=texto||'ouvindo…';}
  }

  // ── CAMPOS MANHÃ ──
  function buildCamposManha(){
    const wrap=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});

    const grid=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}});
    // Sono
    const sonoWrap=el('div',{});
    sonoWrap.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'6px'}},'😴 sono (horas)'));
    const sonoInp=el('input',{type:'number',min:'0',max:'12',step:'0.5',placeholder:'ex: 7',style:{width:'100%',background:'rgba(255,255,255,0.06)',border:`1px solid ${C.bd}`,borderRadius:'8px',padding:'9px 12px',color:C.text,fontSize:'16px',boxSizing:'border-box',outline:'none'}});
    sonoInp.value=sono;sonoInp.addEventListener('input',e=>sono=e.target.value);
    sonoWrap.appendChild(sonoInp);grid.appendChild(sonoWrap);
    // Sintoma
    const sintWrap=el('div',{});
    sintWrap.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'6px'}},'🤒 sintoma ao acordar'));
    const sintInp=el('input',{type:'text',placeholder:'ex: dor de cabeça',style:{width:'100%',background:'rgba(255,255,255,0.06)',border:`1px solid ${C.bd}`,borderRadius:'8px',padding:'9px 12px',color:C.text,fontSize:'16px',boxSizing:'border-box',outline:'none'}});
    sintInp.value=sintomaManha;sintInp.addEventListener('input',e=>sintomaManha=e.target.value);
    sintWrap.appendChild(sintInp);grid.appendChild(sintWrap);
    wrap.appendChild(grid);

    // Qualidade sono
    const qWrap=el('div',{});
    qWrap.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'8px'}},'qualidade do sono'));
    const qRow=el('div',{style:{display:'flex',gap:'6px'}});
    SONO_OPTS.forEach((l,i)=>{
      const b=el('button',{style:{flex:'1',padding:'7px 0',borderRadius:'8px',fontSize:'11px',
        background:sonoQ===i+1?`${cor}30`:'rgba(255,255,255,0.04)',
        border:`1px solid ${sonoQ===i+1?cor:C.bd}`,
        color:sonoQ===i+1?cor:C.faint,fontWeight:sonoQ===i+1?'600':'400'}},l);
      b.addEventListener('click',()=>{sonoQ=i+1;refreshCampos();});
      qRow.appendChild(b);
    });
    qWrap.appendChild(qRow);wrap.appendChild(qWrap);
    return wrap;
  }

  // ── CAMPOS NOITE ──
  function buildCamposNoite(){
    const wrap=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});

    // Energia
    const enWrap=el('div',{});
    enWrap.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'10px'}},'⚡ como variou sua energia hoje'));
    const enGrid=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}});
    ['de manhã','agora / à noite'].forEach((lbl,side)=>{
      const w=el('div',{});
      w.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'6px',fontFamily:'monospace'}},lbl));
      const row=el('div',{style:{display:'flex',gap:'5px'}});
      [1,2,3,4,5].forEach(n=>{
        const val=side===0?enI:enF;
        const b=el('button',{style:{flex:'1',height:'28px',borderRadius:'6px',fontSize:'12px',fontWeight:'600',
          background:val>=n?`${cor}35`:'rgba(255,255,255,0.04)',
          border:`1px solid ${val>=n?cor:C.bd}`,
          color:val>=n?cor:C.faint}},String(n));
        b.addEventListener('click',()=>{if(side===0)enI=n;else enF=n;refreshCampos();});
        row.appendChild(b);
      });
      w.appendChild(row);enGrid.appendChild(w);
    });
    enWrap.appendChild(enGrid);wrap.appendChild(enWrap);

    // Humor
    const hWrap=el('div',{});
    hWrap.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'8px'}},'saldo de humor do dia'));
    const hRow=el('div',{style:{display:'flex',gap:'6px'}});
    HUMORES.forEach((e,i)=>{
      const b=el('button',{style:{flex:'1',height:'36px',borderRadius:'8px',fontSize:'20px',
        background:humor===i+1?`${cor}22`:'rgba(255,255,255,0.04)',
        border:`1px solid ${humor===i+1?cor:C.bd}`}},e);
      b.addEventListener('click',()=>{humor=i+1;refreshCampos();});
      hRow.appendChild(b);
    });
    hWrap.appendChild(hRow);wrap.appendChild(hWrap);

    // Alimentação
    const aWrap=el('div',{});
    aWrap.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'8px'}},'🥗 alimentação hoje'));
    const aRow=el('div',{style:{display:'flex',gap:'6px'}});
    ALIM_OPTS.forEach(a=>{
      const b=el('button',{style:{flex:'1',padding:'7px 0',borderRadius:'8px',fontSize:'12px',
        background:alim===a?`${cor}25`:'rgba(255,255,255,0.04)',
        border:`1px solid ${alim===a?cor:C.bd}`,
        color:alim===a?cor:C.faint,fontWeight:alim===a?'600':'400'}},a);
      b.addEventListener('click',()=>{alim=a;refreshCampos();});
      aRow.appendChild(b);
    });
    aWrap.appendChild(aRow);wrap.appendChild(aWrap);

    // Sintoma
    const sWrap=el('div',{});
    sWrap.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'6px'}},'🤒 algum sintoma hoje'));
    const sInp=el('input',{type:'text',placeholder:'ex: dor de cabeça, cansaço fora do comum…',style:{width:'100%',background:'rgba(255,255,255,0.06)',border:`1px solid ${C.bd}`,borderRadius:'8px',padding:'9px 12px',color:C.text,fontSize:'16px',boxSizing:'border-box',outline:'none'}});
    sInp.value=sintomaNoite;sInp.addEventListener('input',e=>sintomaNoite=e.target.value);
    sWrap.appendChild(sInp);wrap.appendChild(sWrap);
    return wrap;
  }

  // Refresca só os campos opcionais (botões de seleção)
  function refreshCampos(){
    const camposBox=content.querySelector('.campos-box');
    if(camposBox){
      const inner=camposBox.querySelector('.campos-inner');
      if(inner){inner.remove();}
      const novo=el('div',{class:'campos-inner'});
      novo.appendChild(momento==='manha'?buildCamposManha():buildCamposNoite());
      camposBox.appendChild(novo);
    } else {showForm();}
  }

  // ── LOADING ──
  function showLoading(msg){
    fase='loading';updateNavBtns('form');
    content.innerHTML='';
    const wrap=el('div',{style:{textAlign:'center',padding:'72px 0'}});
    wrap.appendChild(el('div',{style:{width:'44px',height:'44px',borderRadius:'50%',border:`3px solid ${cor}20`,borderTop:`3px solid ${cor}`,margin:'0 auto 20px',animation:'spin 0.9s linear infinite'}}));
    wrap.appendChild(el('div',{style:{color:C.muted,fontSize:'14px'}},msg));
    content.appendChild(wrap);
  }

  // ── INSIGHT ──
  function showInsight(text){
    fase='insight';updateNavBtns('form');
    content.innerHTML='';
    const wrap=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'},class:'fade'});
    const card=el('div',{style:{background:`linear-gradient(135deg,${cor}18,${cor}06)`,border:`1px solid ${cor}30`,borderRadius:'20px',padding:'28px 22px'}});
    card.appendChild(el('div',{style:{fontSize:'10px',color:cor,letterSpacing:'0.12em',textTransform:'uppercase',fontFamily:'monospace',marginBottom:'16px'}},momento==='manha'?'🌤 bom dia':'🌙 boa noite'));
    card.appendChild(el('div',{style:{fontSize:'17px',lineHeight:'1.78',color:C.text}},text));
    wrap.appendChild(card);
    const row=el('div',{style:{display:'flex',gap:'10px'}});
    const nb=el('button',{style:{flex:'1',padding:'12px 0',borderRadius:'12px',background:C.sf,border:`1px solid ${C.bd}`,color:C.muted,fontSize:'14px'}},'novo check-in');
    nb.addEventListener('click',()=>{resetForm();showForm();});
    const hb=el('button',{style:{flex:'1',padding:'12px 0',borderRadius:'12px',background:`${cor}12`,border:`1px solid ${cor}40`,color:cor,fontSize:'14px'}},'ver histórico');
    hb.addEventListener('click',()=>showHistorico());
    row.appendChild(nb);row.appendChild(hb);wrap.appendChild(row);
    content.appendChild(wrap);
  }

  // ── ANÁLISE ──
  function showAnalise(text){
    fase='analise';updateNavBtns('form');
    content.innerHTML='';
    const wrap=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'},class:'fade'});
    const card=el('div',{style:{background:`linear-gradient(135deg,rgba(26,16,64,0.9),${cor}20)`,border:`1px solid ${cor}40`,borderRadius:'20px',padding:'28px 22px'}});
    card.appendChild(el('div',{style:{fontSize:'10px',color:cor,letterSpacing:'0.12em',textTransform:'uppercase',fontFamily:'monospace',marginBottom:'16px'}},`✦ reflexão da semana · ${profile.nome}`));
    card.appendChild(el('div',{style:{fontSize:'16px',lineHeight:'1.8',color:C.text}},text));
    wrap.appendChild(card);
    const vb=el('button',{style:{padding:'12px 0',borderRadius:'12px',background:C.sf,border:`1px solid ${C.bd}`,color:C.muted,fontSize:'14px',width:'100%'}},'voltar');
    vb.addEventListener('click',()=>{resetForm();showForm();});
    wrap.appendChild(vb);
    content.appendChild(wrap);
  }

  // ── HISTÓRICO ──
  function showHistorico(){
    fase='historico';updateNavBtns('historico');
    content.innerHTML='';
    const wrap=el('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});

    if(checkins.length===0){
      wrap.appendChild(el('div',{style:{textAlign:'center',padding:'56px 0',color:C.faint,fontSize:'14px'}},'nenhum check-in ainda.'));
    } else {
      // Calendário mini
      const dias=[...new Set(checkins.map(c=>c.data))].sort().slice(-7);
      const cal=el('div',{style:{display:'flex',gap:'6px',padding:'14px 16px',background:C.sf,borderRadius:'14px',border:`1px solid ${C.bd}`,marginBottom:'4px'}});
      dias.forEach(d_=>{
        const m=checkins.find(c=>c.data===d_&&c.momento==='manha');
        const n=checkins.find(c=>c.data===d_&&c.momento==='noite');
        const col=el('div',{style:{flex:'1',textAlign:'center'}});
        col.appendChild(el('div',{style:{fontSize:'10px',color:d_===today()?cor:C.faint,marginBottom:'5px',fontFamily:'monospace'}},wday(d_)));
        const bars=el('div',{style:{display:'flex',flexDirection:'column',gap:'3px'}});
        bars.appendChild(el('div',{style:{height:'5px',borderRadius:'3px',background:m?cor:'rgba(255,255,255,0.07)'}}));
        bars.appendChild(el('div',{style:{height:'5px',borderRadius:'3px',background:n?`${cor}88`:'rgba(255,255,255,0.07)'}}));
        col.appendChild(bars);cal.appendChild(col);
      });
      wrap.appendChild(cal);

      // Items
      [...checkins].reverse().forEach(c=>{
        const item=el('div',{style:{background:C.sf,border:`1px solid ${C.bd}`,borderRadius:'14px',padding:'14px 16px'}});
        const top=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}});
        top.appendChild(el('div',{style:{fontSize:'11px',color:cor,fontFamily:'monospace'}},`${fmtDate(c.data)} · ${c.momento==='manha'?'🌤 manhã':'🌙 noite'}`));
        const meta=el('div',{style:{display:'flex',gap:'8px',fontSize:'12px',color:C.muted}});
        if(c.momento==='manha'&&c.dados?.sono_horas)meta.appendChild(document.createTextNode(`😴 ${c.dados.sono_horas}h`));
        if(c.momento==='noite'&&c.dados?.energia_inicio)meta.appendChild(document.createTextNode(`⚡ ${c.dados.energia_inicio}→${c.dados.energia_fim??'?'}`));
        if(c.dados?.humor)meta.appendChild(document.createTextNode(HUMORES[HUMOR_LBL.indexOf(c.dados.humor)]??'😐'));
        top.appendChild(meta);item.appendChild(top);
        item.appendChild(el('div',{style:{fontSize:'13px',color:'rgba(255,255,255,0.42)',lineHeight:'1.55',fontStyle:'italic'}},`"${c.texto_original}"`));
        if((c.dados?.sintomas||[]).length>0){
          const tags=el('div',{style:{marginTop:'8px',display:'flex',gap:'5px',flexWrap:'wrap'}});
          c.dados.sintomas.forEach(s=>tags.appendChild(el('div',{style:{fontSize:'11px',background:`${cor}20`,color:cor,borderRadius:'20px',padding:'2px 10px'}},s)));
          item.appendChild(tags);
        }
        wrap.appendChild(item);
      });
    }

    const nb=el('button',{style:{padding:'13px 0',borderRadius:'14px',background:`linear-gradient(135deg,${cor}80,${cor})`,border:'none',color:'#fff',fontSize:'14px',fontWeight:'600',marginTop:'4px',width:'100%'}},'novo check-in');
    nb.addEventListener('click',()=>{resetForm();showForm();});
    wrap.appendChild(nb);
    if(checkins.length>=4){
      const ab=el('button',{style:{padding:'12px 0',borderRadius:'14px',background:`${cor}10`,border:`1px solid ${cor}40`,color:cor,fontSize:'14px',width:'100%'}},`✦ análise da semana`);
      ab.addEventListener('click',handleAnalise);
      wrap.appendChild(ab);
    }
    content.appendChild(wrap);
  }

  // ── RESET ──
  function resetForm(){
    resetRec();
    texto='';isInterim='';recStatus='idle';voiceErr='';
    sono='';sonoQ=0;sintomaManha='';
    enI=0;enF=0;humor=0;alim='';sintomaNoite='';
    insight='';analise='';
  }

  // ── SUBMIT ──
  async function handleSubmit(){
    if(!texto.trim())return;
    if(recStatus==='recording')stopRec(t=>{texto=t;});
    showLoading('Processando seu check-in…');
    const extras=momento==='manha'
      ?{sono_horas:sono||null,sono_q:sonoQ||null,sintoma:sintomaManha||null}
      :{energia_i:enI||null,energia_f:enF||null,humor:humor?HUMOR_LBL[humor-1]:null,alim:alim||null,sintoma:sintomaNoite||null};
    let dados={};
    try{
      showLoading('Entendendo o que você disse…');
      const raw=await callClaude(buildExtractor(texto,momento,extras));
      dados=JSON.parse(raw.replace(/```json|```/g,'').trim());
    }catch{dados={...extras,nota_livre:texto,contexto_momento:momento,sintomas:extras.sintoma?[extras.sintoma]:[]};}
    const novo={id:Date.now(),data:today(),momento,texto_original:texto,dados};
    checkins=[...checkins,novo];
    saveCheckins(profile.id,checkins);
    showLoading('Preparando seu insight…');
    const hist=checkins.slice(-14).filter(c=>c.id!==novo.id);
    try{
      const ins=await callClaude(buildInsight(dados,hist,profile.nome,momento));
      showInsight(ins);
    }catch{showInsight('Erro ao gerar insight. Verifique sua API key.');}
  }

  async function handleAnalise(){
    showLoading('Analisando sua semana…');
    try{
      const r=await callClaude(buildAnalise(checkins.slice(-14),profile.nome));
      showAnalise(r);
    }catch{showAnalise('Erro ao gerar análise. Verifique sua API key.');}
  }

  // Inicia na tela de form
  showForm();
  return root;
}

// ── EL HELPER ─────────────────────────────────────────────────
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(['placeholder','type','rows','min','max','step','title'].includes(k))e[k]=v;
    else if(k==='disabled'&&v)e.disabled=true;
    else e.setAttribute(k,v);
  });
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}

// ── LOGO ──────────────────────────────────────────────────────
function buildLogo(sub){
  const w=el('div',{style:{marginBottom:'32px',textAlign:'center'}});
  const t=el('div',{style:{fontSize:'32px',fontWeight:'700',letterSpacing:'-0.03em',marginBottom:'8px'}});
  t.innerHTML=`<span style="color:rgba(255,255,255,0.28);font-weight:300">meu</span><span style="color:#fff">d</span><span style="color:${C.lav}">IA</span><span style="color:#fff">rio</span>`;
  w.appendChild(t);
  w.appendChild(el('div',{style:{fontSize:'13px',color:C.faint,fontFamily:'monospace',letterSpacing:'0.08em'}},sub));
  return w;
}

// ── INIT ──────────────────────────────────────────────────────
const hasKey=!!getApiKey();
navigate(hasKey?'select':'setup');
</script>
