const SK_APIKEY   = 'mdia_apikey';

// ── STORAGE ───────────────────────────────────────────────────
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}};
const loadProfiles=()=>{try{return JSON.parse(lsGet(SK_PROFILES)||'[]')}catch{return[]}};
const saveProfiles=l=>lsSet(SK_PROFILES,JSON.stringify(l));
const loadCheckins=id=>{try{return JSON.parse(lsGet(SK_CHECKINS(id))||'[]')}catch{return[]}};
const saveCheckins=(id,l)=>lsSet(SK_CHECKINS(id),JSON.stringify(l));
const getApiKey=()=>lsGet(SK_APIKEY)||'';
const setApiKey=k=>lsSet(SK_APIKEY,k);

// ── PASSWORD HASH (simples, não criptográfico — apenas privacidade básica) ──
async function hashPin(pin){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mdia_'+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── HELPERS ───────────────────────────────────────────────────
const today  =()=>new Date().toISOString().split('T')[0];
const fmtDate=iso=>new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
const wday   =iso=>new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const fmtSec =s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const uid    =()=>Math.random().toString(36).slice(2,9);
const getPal =id=>PALETTE.find(p=>p.id===id)||PALETTE[0];

// ── API ───────────────────────────────────────────────────────
async function callClaude(prompt){
  const key=getApiKey();
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]}),
  });
  const d=await res.json();
  if(d.error)throw new Error(d.error.message);
  return d.content?.[0]?.text||'';
}

// ── PROMPTS ───────────────────────────────────────────────────
function buildExtractor(text,momento,extras){
  const lines=[
    extras.sono_horas?`Sono: ${extras.sono_horas}h`:'',
    extras.sono_q?`Qualidade sono: ${extras.sono_q}/5`:'',
    extras.energia_i?`Energia início: ${extras.energia_i}/5`:'',
    extras.energia_f?`Energia fim: ${extras.energia_f}/5`:'',
    extras.humor?`Humor: ${extras.humor}`:'',
    extras.alim?`Alimentação: ${extras.alim}`:'',
    extras.sintoma?`Sintoma: ${extras.sintoma}`:'',
  ].filter(Boolean).join('\n');
  return `Você é um extrator silencioso de dados de saúde do app meudIArio.
Analise o relato e retorne APENAS JSON válido, sem explicações, sem markdown.
Contexto: check-in de ${momento==='manha'?'MANHÃ':'NOITE'}
Relato: "${text}"
${lines}
Retorne exatamente (null para não mencionado):
{"sono_horas":null,"sono_qualidade":null,"energia_inicio":null,"energia_fim":null,"humor":null,"sintomas":[],"alimentacao":null,"hidratacao":null,"nota_livre":null,"contexto_momento":"${momento}"}`;
}
function detectPadroes(hist){
  if(hist.length<3)return null;
  const p=[];
  const en=hist.filter(h=>h.dados?.energia_fim??h.dados?.energia_inicio).map(h=>h.dados?.energia_fim??h.dados?.energia_inicio);
  if(en.length>=3){const m=en.reduce((a,b)=>a+b,0)/en.length,r=en.slice(-2).reduce((a,b)=>a+b,0)/2;if(r<m-.5)p.push('Energia abaixo da média');if(r>m+.5)p.push('Energia acima da média');}
  const sn=hist.filter(h=>h.dados?.sono_horas).map(h=>h.dados.sono_horas);
  if(sn.length>=3){const m=sn.reduce((a,b)=>a+b,0)/sn.length;if(m<6.5)p.push(`Sono médio baixo (${m.toFixed(1)}h)`);}
  const fr={};hist.flatMap(h=>h.dados?.sintomas||[]).forEach(s=>{fr[s]=(fr[s]||0)+1;});
  Object.entries(fr).forEach(([s,n])=>{if(n>=2)p.push(`"${s}" recorrente`);});
  return p.join('; ')||null;
}
function buildInsight(dados,hist,nome,momento){
  const h=hist.length>0?hist.map(d=>`${fmtDate(d.data)} (${d.momento}): ${JSON.stringify(d.dados)}`).join('\n'):'Primeiro registro.';
  const pad=detectPadroes(hist);
  return `Você é o meudIArio — companheiro de saúde de ${nome}.
Use todos os dados. Não mencione nenhum dado explicitamente.
MOMENTO: ${momento==='manha'?'MANHÃ (como acordou, sono, estado inicial)':'NOITE (saldo do dia, variação de energia, como está agora)'}
DADOS HOJE: ${JSON.stringify(dados)}
HISTÓRICO: ${h}
PADRÕES (interno): ${pad||'Poucos dados.'}
REGRAS: máximo 3 frases · nunca liste dados ou métricas · nunca diga "detectamos" · nunca seja genérico ou clichê · fale como quem conhece essa pessoa há meses · se houver padrão, insinue com leveza · uma pergunta só se fizer sentido real · responda direto, sem introdução.`;
}
function buildAnalise(checkins,nome){
  return `Você é o meudIArio. Analise os registros de ${nome} e gere uma reflexão — algo que a pessoa não perceberia sozinha.
REGISTROS: ${checkins.map(d=>`${fmtDate(d.data)} (${d.momento}): ${JSON.stringify(d.dados)}`).join('\n')}
REGRAS: 3 a 5 frases · nunca mencione dados técnicos · revele padrão de forma humana · termine com pergunta genuína · seja específico.`;
}

// ── VOICE ─────────────────────────────────────────────────────
let recognition=null,recTimer=null,accumulated='';
const voiceOK='SpeechRecognition' in window||'webkitSpeechRecognition' in window;
function startRec(onUpdate,onErr){
  if(!voiceOK){onErr('Use Chrome ou Safari para gravar voz.');return;}
  accumulated='';
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='pt-BR';recognition.continuous=true;recognition.interimResults=true;
  recognition.onresult=e=>{let fi='',in_='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fi+=t+' ';else in_+=t;}if(fi)accumulated+=fi;onUpdate((accumulated+in_).trim(),!!in_);};
  recognition.onerror=e=>{if(e.error!=='no-speech')onErr('Verifique a permissão do microfone.');};
  recognition.onend=()=>{if(recognition){onUpdate(accumulated.trim(),false);recognition=null;clearInterval(recTimer);}};
  recognition.start();recTimer=setInterval(()=>{},1000);
}
function stopRec(onUpdate){if(recognition){recognition.stop();recognition=null;}clearInterval(recTimer);if(onUpdate)onUpdate(accumulated.trim(),false);}
function resetRec(){if(recognition){recognition.stop();recognition=null;}clearInterval(recTimer);accumulated='';}

// ── DOM HELPER ────────────────────────────────────────────────
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(['placeholder','type','rows','min','max','step','title','inputmode'].includes(k))e[k]=v;
    else if(k==='disabled'&&v)e.disabled=true;
    else e.setAttribute(k,v);
  });
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}

function buildLogo(sub){

  t.innerHTML=`<span style="color:rgba(255,255,255,0.28);font-weight:300">meu</span><span style="color:#fff">d</span><span style="color:${C.lav}">IA</span><span style="color:#fff">rio</span>`;
  w.appendChild(t);
  if(sub)w.appendChild(el('div',{style:{fontSize:'13px',color:C.faint,fontFamily:'monospace',letterSpacing:'0.08em'}},sub));
  return w;
}

// ── ROUTER ────────────────────────────────────────────────────
let currentScreen='setup';
let currentProfile=null;
function navigate(screen,profile){
  currentScreen=screen;currentProfile=profile||null;
  const app=document.getElementById('app');app.innerHTML='';
  if(screen==='setup')       app.appendChild(buildSetup());
  else if(screen==='select') app.appendChild(buildSelect());
  else if(screen==='newprofile') app.appendChild(buildNewProfile());
  else if(screen==='pin')    app.appendChild(buildPin(profile));
  else if(screen==='app')    app.appendChild(buildApp(profile));
}

// ── SCREEN: SETUP ─────────────────────────────────────────────
function buildSetup(){
  const wrap=el('div',{style:{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px'}});
  wrap.appendChild(buildLogo('configure para começar'));
  const card=el('div',{style:{width:'100%',maxWidth:'380px',background:C.sf,border:`1px solid ${C.bd}`,borderRadius:'20px',padding:'28px 24px',display:'flex',flexDirection:'column',gap:'16px'}});
  card.appendChild(el('p',{style:{fontSize:'13px',color:C.muted,lineHeight:'1.6'}},'Para funcionar, o app precisa de uma ',el('strong',{style:{color:C.lav}},'API Key da Anthropic'),'. Ela fica salva só neste dispositivo.'));
  const keyWrap=el('div',{style:{position:'relative'}});
  const keyInput=el('input',{type:'password',placeholder:'sk-ant-...',style:{width:'100%',background:'rgba(255,255,255,0.07)',border:`1px solid ${C.bd}`,borderRadius:'10px',padding:'12px 44px 12px 14px',color:C.text,fontSize:'16px',outline:'none',boxSizing:'border-box'}});
  keyInput.value=getApiKey();
  let showKey=false;
  const eye=el('button',{style:{position:'absolute',right:'12px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:C.faint,fontSize:'18px',padding:'4px',lineHeight:'1'}},'👁');
  eye.addEventListener('click',()=>{showKey=!showKey;keyInput.type=showKey?'text':'password';eye.textContent=showKey?'🙈':'👁';});
  keyWrap.appendChild(keyInput);keyWrap.appendChild(eye);
  const keySection=el('div',{});
  keySection.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'8px',fontFamily:'monospace',letterSpacing:'0.06em',textTransform:'uppercase'}},'API Key'));
  keySection.appendChild(keyWrap);
  card.appendChild(keySection);
  card.appendChild(el('p',{style:{fontSize:'11px',color:C.faint,lineHeight:'1.5'}},'Acesse ',el('strong',{},'console.anthropic.com'),' → Settings → API Keys → Create Key'));
  const saveBtn=el('button',{style:{padding:'13px 0',borderRadius:'12px',border:'none',background:'linear-gradient(135deg,#4A2D8A,#9B6FE8)',color:'#fff',fontSize:'15px',fontWeight:'600',width:'100%'}},'salvar e começar');
  saveBtn.addEventListener('click',()=>{const k=keyInput.value.trim();if(!k){alert('Cole sua API key para continuar.');return;}if(setApiKey(k))navigate('select');else alert('Erro ao salvar. Tente novamente.');});
  card.appendChild(saveBtn);
  if(getApiKey()){const skip=el('button',{style:{padding:'10px 0',borderRadius:'12px',border:`1px solid ${C.bd}`,background:'transparent',color:C.faint,fontSize:'13px',width:'100%'}},'já configurado — continuar →');skip.addEventListener('click',()=>navigate('select'));card.appendChild(skip);}
  wrap.appendChild(card);
  return wrap;
}

// ── SCREEN: SELECT ────────────────────────────────────────────
function buildSelect(){
  let editMode=false;
  const wrap=el('div',{style:{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px 20px'}});
  wrap.appendChild(buildLogo('quem está fazendo o check-in?'));

  // Subtítulo de modo edição
  const editHint=el('div',{style:{fontSize:'12px',color:C.red,fontFamily:'monospace',letterSpacing:'0.06em',marginBottom:'12px',height:'18px',textAlign:'center',opacity:'0',transition:'opacity 0.2s'}},'modo edição — toque no ✕ para excluir');
  wrap.appendChild(editHint);

  const gridWrap=el('div',{style:{width:'100%',maxWidth:'460px'}});
  wrap.appendChild(gridWrap);

  function renderGrid(){
    gridWrap.innerHTML='';
    const profiles=loadProfiles();
    const cols=profiles.length<=1?'1fr':profiles.length===2?'1fr 1fr':'repeat(auto-fill,minmax(130px,1fr))';
    const grid=el('div',{style:{display:'grid',gridTemplateColumns:cols,gap:'12px'}});

    profiles.forEach(p=>{
      const pal=getPal(p.cor);
      const count=loadCheckins(p.id).length;

      // Wrapper com posição relativa para o botão de excluir
      const cardWrap=el('div',{style:{position:'relative'}});

      const btn=el('button',{style:{width:'100%',padding:'22px 12px',borderRadius:'18px',border:`1.5px solid ${editMode?C.red+'60':pal.cor+'44'}`,background:editMode?'rgba(196,64,74,0.06)':`${pal.cor}0D`,display:'flex',flexDirection:'column',alignItems:'center',gap:'10px',transition:'all 0.2s'}});
      btn.appendChild(el('div',{style:{fontSize:'44px',lineHeight:'1'}},p.emoji));
      btn.appendChild(el('div',{style:{fontSize:'16px',fontWeight:'600',color:editMode?C.muted:pal.cor}},p.nome));
      btn.appendChild(el('div',{style:{display:'flex',alignItems:'center',gap:'5px'}},
        p.pin?el('span',{style:{fontSize:'11px',color:C.faint}},'🔒'):null,
        el('span',{style:{fontSize:'10px',color:C.faint,fontFamily:'monospace'}},`${count} registro${count!==1?'s':''}`)
      ));

      // Clique normal = entrar; clique longo = modo edição
      let pressTimer=null;
      btn.addEventListener('pointerdown',()=>{pressTimer=setTimeout(()=>{editMode=true;renderGrid();},600);});
      btn.addEventListener('pointerup',()=>clearTimeout(pressTimer));
      btn.addEventListener('pointercancel',()=>clearTimeout(pressTimer));
      btn.addEventListener('click',()=>{if(!editMode){p.pin?navigate('pin',p):navigate('app',p);}});

      cardWrap.appendChild(btn);

      // Botão excluir — aparece no modo edição
      if(editMode){
        const delBtn=el('button',{style:{position:'absolute',top:'-8px',right:'-8px',width:'28px',height:'28px',borderRadius:'50%',background:C.red,border:'2px solid #0D0D1A',color:'#fff',fontSize:'14px',fontWeight:'700',display:'flex',alignItems:'center',justifyContent:'center',lineHeight:'1',zIndex:'10'}},'✕');
        delBtn.addEventListener('click',e=>{
          e.stopPropagation();
          const nome=p.nome;
          const count2=loadCheckins(p.id).length;
          const msg=count2>0
            ?`Excluir o perfil "${nome}"?\n\n⚠️ Isso apagará ${count2} registro${count2!==1?'s':''} permanentemente.\n\nDigite EXCLUIR para confirmar:`
            :`Excluir o perfil "${nome}"? Esta ação não pode ser desfeita.`;
          if(count2>0){
            const confirmado=prompt(msg);
            if(confirmado?.trim().toUpperCase()!=='EXCLUIR')return;
          } else {
            if(!confirm(msg))return;
          }
          // Remove perfil e dados
          const lista=loadProfiles().filter(x=>x.id!==p.id);
          saveProfiles(lista);
          try{localStorage.removeItem(SK_CHECKINS(p.id));}catch{}
          if(lista.length===0)editMode=false;
          renderGrid();
        });
        cardWrap.appendChild(delBtn);
      }

      grid.appendChild(cardWrap);
    });

    // Botão adicionar
    const addBtn=el('button',{style:{padding:'22px 12px',borderRadius:'18px',border:`1.5px dashed ${C.bd}`,background:'transparent',display:'flex',flexDirection:'column',alignItems:'center',gap:'10px',color:C.faint,width:'100%',opacity:editMode?'0.3':'1'}});
    addBtn.appendChild(el('div',{style:{fontSize:'32px',lineHeight:'1'}},'+'));
    addBtn.appendChild(el('div',{style:{fontSize:'13px'}},'novo perfil'));
    addBtn.addEventListener('click',()=>{if(!editMode)navigate('newprofile');});
    const addWrap=el('div',{});addWrap.appendChild(addBtn);
    grid.appendChild(addWrap);

    gridWrap.appendChild(grid);
  }

  renderGrid();

  // Rodapé
  const footer=el('div',{style:{display:'flex',gap:'16px',marginTop:'20px',alignItems:'center'}});

  const cfg=el('button',{style:{background:'transparent',border:'none',color:C.faint,fontSize:'11px',fontFamily:'monospace',letterSpacing:'0.06em'}},'⚙ alterar API key');
  cfg.addEventListener('click',()=>navigate('setup'));

  const editBtn=el('button',{style:{background:'transparent',border:`1px solid ${C.bd}`,borderRadius:'20px',padding:'5px 14px',color:C.faint,fontSize:'11px',fontFamily:'monospace',letterSpacing:'0.06em'}},'✏ editar perfis');
  editBtn.addEventListener('click',()=>{
    editMode=!editMode;
    editBtn.textContent=editMode?'✓ concluído':'✏ editar perfis';
    editBtn.style.color=editMode?C.red:C.faint;
    editBtn.style.border=`1px solid ${editMode?C.red+'60':C.bd}`;
    editHint.style.opacity=editMode?'1':'0';
    renderGrid();
  });

  footer.appendChild(cfg);
  footer.appendChild(editBtn);
  wrap.appendChild(footer);
  return wrap;
}

// ── SCREEN: PIN ───────────────────────────────────────────────
function buildPin(profile){
  const pal=getPal(profile.cor);
  const cor=pal.cor;
  const wrap=el('div',{style:{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px'}});
  wrap.appendChild(buildLogo(null));

  const card=el('div',{style:{width:'100%',maxWidth:'320px',display:'flex',flexDirection:'column',alignItems:'center',gap:'24px'}});

  // Avatar
  const avatar=el('div',{style:{width:'72px',height:'72px',borderRadius:'50%',background:`${cor}25`,border:`2px solid ${cor}50`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'36px'}},profile.emoji);
  card.appendChild(avatar);
  card.appendChild(el('div',{style:{fontSize:'18px',fontWeight:'600',color:cor,textAlign:'center'}},profile.nome));
  card.appendChild(el('div',{style:{fontSize:'13px',color:C.faint,textAlign:'center'}},'digite seu PIN para entrar'));

  // Dots de exibição
  const dotsWrap=el('div',{style:{display:'flex',gap:'12px',justifyContent:'center',marginTop:'8px'}});
  const dots=[];
  for(let i=0;i<4;i++){
    const d=el('div',{style:{width:'14px',height:'14px',borderRadius:'50%',border:`2px solid ${C.bd}`,background:'transparent',transition:'all 0.15s'}});
    dots.push(d);dotsWrap.appendChild(d);
  }
  card.appendChild(dotsWrap);

  // Mensagem de erro
  const errMsg=el('div',{style:{fontSize:'12px',color:C.red,textAlign:'center',height:'18px',transition:'opacity 0.2s',opacity:'0'}},'PIN incorreto');
  card.appendChild(errMsg);

  // PIN atual
  let pinDigits='';
  function updateDots(){
    dots.forEach((d,i)=>{
      d.style.background=i<pinDigits.length?cor:'transparent';
      d.style.borderColor=i<pinDigits.length?cor:C.bd;
    });
  }
  async function checkPin(){
    const hash=await hashPin(pinDigits);
    if(hash===profile.pin){navigate('app',profile);}
    else{
      errMsg.style.opacity='1';
      dotsWrap.classList.add('shake');
      setTimeout(()=>{dotsWrap.classList.remove('shake');errMsg.style.opacity='0';pinDigits='';updateDots();},600);
    }
  }

  // Teclado numérico
  const pad=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px',width:'240px'}});
  [1,2,3,4,5,6,7,8,9,'','0','⌫'].forEach(k=>{
    if(k===''){pad.appendChild(el('div',{}));return;}
    const b=el('button',{style:{height:'60px',borderRadius:'14px',border:`1px solid ${C.bd}`,background:C.sf,color:C.text,fontSize:k==='⌫'?'20px':'22px',fontWeight:'500',transition:'all 0.1s'}},String(k));
    b.addEventListener('click',()=>{
      if(k==='⌫'){if(pinDigits.length>0){pinDigits=pinDigits.slice(0,-1);updateDots();}}
      else if(pinDigits.length<4){pinDigits+=k;updateDots();if(pinDigits.length===4)checkPin();}
    });
    pad.appendChild(b);
  });
  card.appendChild(pad);

  // Voltar
  const back=el('button',{style:{marginTop:'8px',background:'transparent',border:'none',color:C.faint,fontSize:'13px'}},'← voltar');
  back.addEventListener('click',()=>navigate('select'));
  card.appendChild(back);

  wrap.appendChild(card);
  return wrap;
}

// ── SCREEN: NEW PROFILE ───────────────────────────────────────
function buildNewProfile(){

  const container=el('div',{style:{width:'100%',maxWidth:'380px'}});

      // Preview

      const prevNome=el('div',{style:{fontSize:'20px',fontWeight:'700',color:pal.cor}},npNome||'Nome');
      prev.appendChild(prevEmoji);
      const pm=el('div',{});pm.appendChild(prevNome);pm.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginTop:'2px',fontFamily:'monospace'}},'novo perfil'));prev.appendChild(pm);
      card.appendChild(prev);

      function refreshPreview(){
        const p2=getPal(npCor);
        prevEmoji.textContent=npEmoji;prevNome.textContent=npNome||'Nome';prevNome.style.color=p2.cor;
        prev.style.background=`${p2.cor}0D`;prev.style.border=`1px solid ${p2.cor}30`;
      }

      // Nome
      const ns=el('div',{});ns.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'8px',fontFamily:'monospace',letterSpacing:'0.06em',textTransform:'uppercase'}},'nome'));
      const ni=el('input',{type:'text',placeholder:'ex: Igor, Maria…',style:{width:'100%',background:'rgba(255,255,255,0.07)',border:`1px solid ${C.bd}`,borderRadius:'10px',padding:'12px 14px',color:C.text,fontSize:'16px',outline:'none',boxSizing:'border-box'}});
      ni.value=npNome;ni.addEventListener('input',e=>{npNome=e.target.value;refreshPreview();});
      ns.appendChild(ni);card.appendChild(ns);

      // Emoji
      const es=el('div',{});es.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'8px',fontFamily:'monospace',letterSpacing:'0.06em',textTransform:'uppercase'}},'emoji'));
      const eg=el('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px'}});
      const eBtns={};
      EMOJIS.forEach(e=>{
        const b=el('button',{style:{padding:'6px',borderRadius:'8px',border:`1px solid ${npEmoji===e?getPal(npCor).cor:C.bd}`,background:npEmoji===e?`${getPal(npCor).cor}20`:'transparent',fontSize:'22px',lineHeight:'1'}},e);
        b.addEventListener('click',()=>{npEmoji=e;Object.values(eBtns).forEach(x=>{x.style.border=`1px solid ${C.bd}`;x.style.background='transparent';});b.style.border=`1px solid ${getPal(npCor).cor}`;b.style.background=`${getPal(npCor).cor}20`;refreshPreview();});
        eBtns[e]=b;eg.appendChild(b);
      });
      es.appendChild(eg);card.appendChild(es);

      // Cor
      const cs=el('div',{});cs.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'8px',fontFamily:'monospace',letterSpacing:'0.06em',textTransform:'uppercase'}},'cor'));
      const cg=el('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px'}});
      const cBtns={};
      PALETTE.forEach(p=>{
        const b=el('button',{style:{width:'36px',height:'36px',borderRadius:'50%',border:`2px solid ${p.id===npCor?'#fff':p.cor+'44'}`,background:p.cor,boxShadow:p.id===npCor?`0 0 0 3px ${p.cor}66`:'none',transition:'all 0.15s'},title:p.label});
        b.addEventListener('click',()=>{
          npCor=p.id;
          Object.values(cBtns).forEach(x=>{x.style.border=`2px solid ${x._c}44`;x.style.boxShadow='none';});
          b.style.border='2px solid #fff';b.style.boxShadow=`0 0 0 3px ${p.cor}66`;
          refreshPreview();
          if(eBtns[npEmoji]){Object.values(eBtns).forEach(x=>{x.style.border=`1px solid ${C.bd}`;x.style.background='transparent';});eBtns[npEmoji].style.border=`1px solid ${p.cor}`;eBtns[npEmoji].style.background=`${p.cor}20`;}
        });
        b._c=p.cor;cBtns[p.id]=b;cg.appendChild(b);
      });
      cBtns['violet'].style.border='2px solid #fff';cBtns['violet'].style.boxShadow=`0 0 0 3px ${getPal('violet').cor}66`;
      cs.appendChild(cg);card.appendChild(cs);

      // Botões
      const br=el('div',{style:{display:'flex',gap:'10px'}});
      const cb=el('button',{style:{flex:'1',padding:'12px 0',borderRadius:'12px',border:`1px solid ${C.bd}`,background:'transparent',color:C.faint,fontSize:'14px'}},'cancelar');
      cb.addEventListener('click',()=>navigate('select'));
      const nb=el('button',{style:{flex:'2',padding:'12px 0',borderRadius:'12px',border:'none',background:`linear-gradient(135deg,${getPal(npCor).cor}88,${getPal(npCor).cor})`,color:'#fff',fontSize:'15px',fontWeight:'600'}},'próximo →');
      nb.addEventListener('click',()=>{if(!npNome.trim()){alert('Digite um nome para o perfil.');return;}npStep=1;renderStep();});
      br.appendChild(cb);br.appendChild(nb);card.appendChild(br);
      container.appendChild(card);
    }

    // STEP 1: definir PIN
    else if(npStep===1){
      renderPinStep('criar PIN de acesso','Este PIN protege o seu perfil.',false,(digits)=>{npPin=digits;npStep=2;renderStep();},()=>{npStep=0;renderStep();});
    }

    // STEP 2: confirmar PIN
    else if(npStep===2){
      renderPinStep('confirmar PIN','Digite o PIN novamente para confirmar.',true,async(digits)=>{
        if(digits!==npPin){return false;}
        const hash=digits?await hashPin(digits):null;
        const novo={id:uid(),nome:npNome.trim(),emoji:npEmoji,cor:npCor,pin:hash};
        const lista=[...loadProfiles(),novo];
        saveProfiles(lista);
        navigate('select');
        return true;
      },()=>{npStep=1;renderStep();});
    }
  }

  function renderPinStep(title,subtitle,isConfirm,onComplete,onBack){
    const pal=getPal(npCor);const cor=pal.cor;
    const wrap2=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'20px'}});
    wrap2.appendChild(el('div',{style:{fontSize:'40px',lineHeight:'1',textAlign:'center'}},npEmoji));
    wrap2.appendChild(el('div',{style:{fontSize:'17px',fontWeight:'600',color:cor,textAlign:'center'}},title));
    wrap2.appendChild(el('div',{style:{fontSize:'13px',color:C.faint,textAlign:'center',lineHeight:'1.5'}},subtitle));

    // Opção sem PIN (só no step 1)
    if(!isConfirm){
      const skip=el('button',{style:{fontSize:'12px',color:C.faint,background:'transparent',border:`1px solid ${C.bd}`,borderRadius:'20px',padding:'5px 14px'}},'entrar sem PIN');
      skip.addEventListener('click',async()=>{
        const novo={id:uid(),nome:npNome.trim(),emoji:npEmoji,cor:npCor,pin:null};
        saveProfiles([...loadProfiles(),novo]);navigate('select');
      });
      wrap2.appendChild(skip);
    }

    // Dots
    const dotsWrap=el('div',{style:{display:'flex',gap:'12px',justifyContent:'center'}});
    const dots=[];
    for(let i=0;i<4;i++){const d=el('div',{style:{width:'14px',height:'14px',borderRadius:'50%',border:`2px solid ${C.bd}`,background:'transparent',transition:'all 0.15s'}});dots.push(d);dotsWrap.appendChild(d);}
    wrap2.appendChild(dotsWrap);

    const err=el('div',{style:{fontSize:'12px',color:C.red,textAlign:'center',height:'16px',opacity:'0'}},'PINs não coincidem');
    wrap2.appendChild(err);

    let digits='';
    function updDots(){dots.forEach((d,i)=>{d.style.background=i<digits.length?cor:'transparent';d.style.borderColor=i<digits.length?cor:C.bd;});}

    const pad=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px',width:'220px'}});
    [1,2,3,4,5,6,7,8,9,'','0','⌫'].forEach(k=>{
      if(k===''){pad.appendChild(el('div',{}));return;}
      const b=el('button',{style:{height:'56px',borderRadius:'12px',border:`1px solid ${C.bd}`,background:C.sf,color:C.text,fontSize:k==='⌫'?'18px':'20px',fontWeight:'500'}},String(k));
      b.addEventListener('click',async()=>{
        if(k==='⌫'){if(digits.length>0){digits=digits.slice(0,-1);updDots();}}
        else if(digits.length<4){digits+=k;updDots();
          if(digits.length===4){
            const result=await onComplete(digits);
            if(result===false){err.style.opacity='1';dotsWrap.classList.add('shake');setTimeout(()=>{dotsWrap.classList.remove('shake');err.style.opacity='0';digits='';updDots();},600);}
          }
        }
      });
      pad.appendChild(b);
    });
    wrap2.appendChild(pad);

    const back=el('button',{style:{background:'transparent',border:'none',color:C.faint,fontSize:'13px'}},'← voltar');
    back.addEventListener('click',onBack);
    wrap2.appendChild(back);
    container.appendChild(wrap2);
  }

  renderStep();
  return wrap;
}

    // Campos
    const cb=el('div',{style:{background:C.sf,border:`1px solid ${C.bd}`,borderRadius:'14px',padding:'16px'}});
    cb.appendChild(el('div',{style:{fontSize:'10px',color:C.faint,marginBottom:'14px',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:'monospace'}},momento==='manha'?'dados da noite':'dados do dia'));
    cb.appendChild(momento==='manha'?buildCamposManha():buildCamposNoite());
    w.appendChild(cb);
    // Enviar
    const eb=el('button',{style:{padding:'14px 0',borderRadius:'14px',border:'none',background:texto.trim()?`linear-gradient(135deg,${cor}99,${cor})`:'rgba(255,255,255,0.06)',color:texto.trim()?'#fff':C.faint,fontSize:'15px',fontWeight:'600',width:'100%',transition:'all 0.2s'}},'enviar check-in');
    eb.addEventListener('click',handleSubmit);w.appendChild(eb);
    if(checkins.length>=4){const ab=el('button',{style:{padding:'12px 0',borderRadius:'14px',background:`${cor}10`,border:`1px solid ${cor}40`,color:cor,fontSize:'14px',fontWeight:'500',width:'100%'}},`✦ análise da semana · ${checkins.length} registros`);ab.addEventListener('click',handleAnalise);w.appendChild(ab);}
    content.appendChild(w);
  }

  function buildVoicePanel(){
    const isRec=recStatus==='recording';
    const panel=el('div',{style:{background:C.sf,border:`1.5px solid ${isRec?'rgba(196,64,74,0.5)':texto?cor+'80':C.bd}`,borderRadius:'18px',padding:'20px 18px',transition:'border-color 0.3s'}});
    panel.appendChild(el('div',{style:{fontSize:'10px',color:C.faint,marginBottom:'18px',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:'monospace'}},momento==='manha'?'como foi a noite e como você acordou?':'como foi o dia?'));
    const micWrap=el('div',{style:{display:'flex',justifyContent:'center',marginBottom:'10px'}});
    const mic=el('button',{style:{width:'80px',height:'80px',borderRadius:'50%',border:'none',cursor:voiceOK?'pointer':'not-allowed',background:isRec?C.gradRec:`linear-gradient(135deg,${cor}99,${cor})`,boxShadow:isRec?'0 0 0 10px rgba(196,64,74,0.12),0 0 0 20px rgba(196,64,74,0.05)':`0 8px 32px ${cor}66`,transition:'all 0.3s',display:'flex',alignItems:'center',justifyContent:'center'}});
    mic.innerHTML=isRec?'<svg width="22" height="22" viewBox="0 0 20 20" fill="white"><rect x="3" y="3" width="14" height="14" rx="2.5"/></svg>':'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
    mic.addEventListener('click',()=>{if(isRec){stopRec(t=>{texto=t;isInterim=false;});recStatus='idle';showForm();}else{recStatus='recording';startRec((t,interim)=>{texto=t;isInterim=interim;const prev=document.getElementById('voice-prev');if(prev){prev.style.color=interim?C.muted:C.text;prev.style.fontStyle=interim?'italic':'normal';prev.textContent=t||'ouvindo…';}},err=>{voiceErr=err;recStatus='error';showForm();});}showForm();});
    micWrap.appendChild(mic);panel.appendChild(micWrap);
    panel.appendChild(el('div',{style:{textAlign:'center',fontSize:'12px',color:isRec?C.red:C.muted,fontFamily:'monospace',letterSpacing:'0.06em',height:'18px',marginBottom:'14px'}},isRec?'⏺ gravando…':voiceOK?'toque para gravar':'use o texto abaixo'));
    if(texto||isRec){const pv=el('div',{style:{background:`${cor}10`,border:`1px solid ${cor}28`,borderRadius:'12px',padding:'12px 14px',marginBottom:'14px',minHeight:'48px'}});const pvt=el('div',{id:'voice-prev',style:{fontSize:'13px',lineHeight:'1.65',color:isInterim?C.muted:C.text,fontStyle:isInterim?'italic':'normal'}},texto||'ouvindo…');pv.appendChild(pvt);panel.appendChild(pv);}
    const sep=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});sep.appendChild(el('div',{style:{flex:'1',height:'1px',background:C.bd}}));sep.appendChild(el('span',{style:{fontSize:'10px',color:C.faint,fontFamily:'monospace',letterSpacing:'0.08em'}},'ou escreva'));sep.appendChild(el('div',{style:{flex:'1',height:'1px',background:C.bd}}));panel.appendChild(sep);
    const ta=el('textarea',{style:{width:'100%',background:'rgba(255,255,255,0.04)',border:`1px solid ${C.bd}`,borderRadius:'10px',padding:'10px 12px',color:C.text,fontSize:'16px',resize:'vertical',outline:'none',lineHeight:'1.6',boxSizing:'border-box'},placeholder:momento==='manha'?'fale ou escreva livremente…':'o saldo do dia, como você está agora…',rows:'3'});
    ta.value=texto;ta.addEventListener('input',e=>{texto=e.target.value;isInterim=false;});panel.appendChild(ta);
    if(voiceErr)panel.appendChild(el('div',{style:{fontSize:'12px',color:C.red,marginTop:'8px'}},`⚠ ${voiceErr}`));
    return panel;
  }

  function buildCamposManha(){
    const w=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});
    const g=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}});
    const si=el('input',{type:'number',min:'0',max:'12',step:'0.5',placeholder:'ex: 7',style:{width:'100%',background:'rgba(255,255,255,0.06)',border:`1px solid ${C.bd}`,borderRadius:'8px',padding:'9px 12px',color:C.text,fontSize:'16px',boxSizing:'border-box',outline:'none'}});
    si.value=sono;si.addEventListener('input',e=>sono=e.target.value);
    const sw=el('div',{});sw.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'6px'}},'😴 sono (horas)'));sw.appendChild(si);g.appendChild(sw);
    const ss=el('input',{type:'text',placeholder:'ex: dor de cabeça',style:{width:'100%',background:'rgba(255,255,255,0.06)',border:`1px solid ${C.bd}`,borderRadius:'8px',padding:'9px 12px',color:C.text,fontSize:'16px',boxSizing:'border-box',outline:'none'}});
    ss.value=sintomaManha;ss.addEventListener('input',e=>sintomaManha=e.target.value);
    const ssw=el('div',{});ssw.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'6px'}},'🤒 sintoma ao acordar'));ssw.appendChild(ss);g.appendChild(ssw);
    w.appendChild(g);
    const qw=el('div',{});qw.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'8px'}},'qualidade do sono'));
    const qr=el('div',{style:{display:'flex',gap:'6px'}});
    SONO_OPTS.forEach((l,i)=>{const b=el('button',{style:{flex:'1',padding:'7px 0',borderRadius:'8px',fontSize:'11px',background:sonoQ===i+1?`${cor}30`:'rgba(255,255,255,0.04)',border:`1px solid ${sonoQ===i+1?cor:C.bd}`,color:sonoQ===i+1?cor:C.faint,fontWeight:sonoQ===i+1?'600':'400'}},l);b.addEventListener('click',()=>{sonoQ=i+1;refreshOpts();});qr.appendChild(b);});
    qw.appendChild(qr);w.appendChild(qw);return w;
  }

  function buildCamposNoite(){
    const w=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});
    const ew=el('div',{});ew.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'10px'}},'⚡ como variou sua energia hoje'));
    const eg=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}});
    ['de manhã','agora / à noite'].forEach((lbl,side)=>{const dw=el('div',{});dw.appendChild(el('div',{style:{fontSize:'11px',color:C.faint,marginBottom:'6px',fontFamily:'monospace'}},lbl));const row=el('div',{style:{display:'flex',gap:'5px'}});[1,2,3,4,5].forEach(n=>{const val=side===0?enI:enF;const b=el('button',{style:{flex:'1',height:'28px',borderRadius:'6px',fontSize:'12px',fontWeight:'600',background:val>=n?`${cor}35`:'rgba(255,255,255,0.04)',border:`1px solid ${val>=n?cor:C.bd}`,color:val>=n?cor:C.faint}},String(n));b.addEventListener('click',()=>{if(side===0)enI=n;else enF=n;refreshOpts();});row.appendChild(b);});dw.appendChild(row);eg.appendChild(dw);});
    ew.appendChild(eg);w.appendChild(ew);
    const hw=el('div',{});hw.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'8px'}},'saldo de humor do dia'));const hr=el('div',{style:{display:'flex',gap:'6px'}});HUMORES.forEach((e,i)=>{const b=el('button',{style:{flex:'1',height:'36px',borderRadius:'8px',fontSize:'20px',background:humor===i+1?`${cor}22`:'rgba(255,255,255,0.04)',border:`1px solid ${humor===i+1?cor:C.bd}`}},e);b.addEventListener('click',()=>{humor=i+1;refreshOpts();});hr.appendChild(b);});hw.appendChild(hr);w.appendChild(hw);
    const aw=el('div',{});aw.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'8px'}},'🥗 alimentação hoje'));const ar=el('div',{style:{display:'flex',gap:'6px'}});ALIM_OPTS.forEach(a=>{const b=el('button',{style:{flex:'1',padding:'7px 0',borderRadius:'8px',fontSize:'12px',background:alim===a?`${cor}25`:'rgba(255,255,255,0.04)',border:`1px solid ${alim===a?cor:C.bd}`,color:alim===a?cor:C.faint,fontWeight:alim===a?'600':'400'}},a);b.addEventListener('click',()=>{alim=a;refreshOpts();});ar.appendChild(b);});aw.appendChild(ar);w.appendChild(aw);
    const snw=el('div',{});snw.appendChild(el('div',{style:{fontSize:'12px',color:C.muted,marginBottom:'6px'}},'🤒 algum sintoma hoje'));const sni=el('input',{type:'text',placeholder:'ex: dor de cabeça, cansaço fora do comum…',style:{width:'100%',background:'rgba(255,255,255,0.06)',border:`1px solid ${C.bd}`,borderRadius:'8px',padding:'9px 12px',color:C.text,fontSize:'16px',boxSizing:'border-box',outline:'none'}});sni.value=sintomaNoite;sni.addEventListener('input',e=>sintomaNoite=e.target.value);snw.appendChild(sni);w.appendChild(snw);
    return w;
  }

  // Refresca só botões de opção sem destruir inputs de texto
  function refreshOpts(){
    const camposBox=content.querySelector('.campos-inner');
    if(camposBox){camposBox.innerHTML='';camposBox.appendChild(momento==='manha'?buildCamposManha():buildCamposNoite());}
    else showForm();
  }

  function resetLocal(){resetRec();texto='';isInterim=false;recStatus='idle';voiceErr='';sono='';sonoQ=0;sintomaManha='';enI=0;enF=0;humor=0;alim='';sintomaNoite='';}

  async function handleSubmit(){
    if(!texto.trim())return;
    if(recStatus==='recording')stopRec(t=>{texto=t;});
    showLoading('Processando seu check-in…');
    const extras=momento==='manha'?{sono_horas:sono||null,sono_q:sonoQ||null,sintoma:sintomaManha||null}:{energia_i:enI||null,energia_f:enF||null,humor:humor?HUMOR_LBL[humor-1]:null,alim:alim||null,sintoma:sintomaNoite||null};
    let dados={};
    try{showLoading('Entendendo o que você disse…');const raw=await callClaude(buildExtractor(texto,momento,extras));dados=JSON.parse(raw.replace(/```json|```/g,'').trim());}
    catch{dados={...extras,nota_livre:texto,contexto_momento:momento,sintomas:extras.sintoma?[extras.sintoma]:[]};}
    const novo={id:Date.now(),data:today(),momento,texto_original:texto,dados};
    checkins=[...checkins,novo];saveCheckins(profile.id,checkins);
    showLoading('Preparando seu insight…');
    const hist=checkins.slice(-14).filter(c=>c.id!==novo.id);
    try{const ins=await callClaude(buildInsight(dados,hist,profile.nome,momento));showInsight(ins);}
    catch{showInsight('Erro ao gerar insight. Verifique sua API key.');}
  }

  async function handleAnalise(){
    showLoading('Analisando sua semana…');
    try{const r=await callClaude(buildAnalise(checkins.slice(-14),profile.nome));showAnalise(r);}
    catch{showAnalise('Erro ao gerar análise. Verifique sua API key.');}
  }

  showForm();
  return root;
}

// ── INIT ──────────────────────────────────────────────────────
navigate(getApiKey()?'select':'setup');
</script>
</body>
</html>
