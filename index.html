// ── HELPERS ───────────────────────────────────────────────────
const today   = () => new Date().toISOString().split("T")[0];
const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"});

// ── API ───────────────────────────────────────────────────────
async function callClaude(prompt) {
  const key = localStorage.getItem(SK_APIKEY)||"";
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]}),
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.content?.[0]?.text??"";
}

// ── PROMPTS ───────────────────────────────────────────────────
function buildExtractor(text, momento, extras) {
  const m = [
    extras.sono_horas   ? `Sono: ${extras.sono_horas}h`            : "",
    extras.sono_q       ? `Qualidade sono: ${extras.sono_q}/5`      : "",
    extras.sintoma      ? `Sintoma: ${extras.sintoma}`              : "",
    extras.energia_i    ? `Energia início: ${extras.energia_i}/5`   : "",
    extras.energia_f    ? `Energia fim: ${extras.energia_f}/5`      : "",
    extras.humor        ? `Humor: ${extras.humor}`                  : "",
    extras.alim         ? `Alimentação: ${extras.alim}`             : "",
  ].filter(Boolean).join("\n");
  return `Você é um extrator silencioso de dados de saúde do app meudIArio.
Analise o relato e retorne APENAS JSON válido, sem explicações, sem markdown.
Contexto: check-in de ${momento==="manha"?"MANHÃ":"NOITE"}
Relato: "${text}"
${m}
Retorne exatamente (null para não mencionado):
{"sono_horas":null,"sono_qualidade":null,"energia_inicio":null,"energia_fim":null,"humor":null,"sintomas":[],"alimentacao":null,"hidratacao":null,"nota_livre":null,"contexto_momento":"${momento}"}`;
}

function buildInsight(dados, hist, nome, momento) {
  const h = hist.length>0
    ? hist.map(d=>`${fmtDate(d.data)} (${d.momento}): ${JSON.stringify(d.dados)}`).join("\n")
    : "Primeiro registro.";
  const pad = detectPadroes(hist);
  return `Você é o meudIArio — companheiro de saúde de ${nome}.
Use todos os dados. Não mencione nenhum dado explicitamente.
MOMENTO: ${momento==="manha"?"MANHÃ (como acordou, sono, estado inicial)":"NOITE (saldo do dia, variação de energia, como está agora)"}
DADOS HOJE: ${JSON.stringify(dados)}
HISTÓRICO: ${h}
PADRÕES (interno): ${pad||"Poucos dados."}
REGRAS: máximo 3 frases · nunca liste dados ou métricas · nunca diga "detectamos" · nunca seja genérico ou clichê · fale como quem conhece essa pessoa há meses · se houver padrão, insinue com leveza · uma pergunta só se fizer sentido real · responda direto, sem introdução.`;
}

function buildAnalise(checkins, nome) {
  return `Você é o meudIArio. Analise os registros de ${nome} e gere uma reflexão — algo que a pessoa não perceberia sozinha.
REGISTROS: ${checkins.map(d=>`${fmtDate(d.data)} (${d.momento}): ${JSON.stringify(d.dados)}`).join("\n")}
REGRAS: 3 a 5 frases · nunca mencione dados técnicos · revele padrão de forma humana · termine com pergunta genuína · seja específico.`;
}

function detectPadroes(hist) {
  if (hist.length<3) return null;
  const p=[];
  const en=hist.filter(h=>h.dados?.energia_fim??h.dados?.energia_inicio).map(h=>h.dados?.energia_fim??h.dados?.energia_inicio);
  if (en.length>=3){const m=en.reduce((a,b)=>a+b,0)/en.length,r=en.slice(-2).reduce((a,b)=>a+b,0)/2;if(r<m-0.5)p.push("Energia abaixo da média");if(r>m+0.5)p.push("Energia acima da média");}
  const sn=hist.filter(h=>h.dados?.sono_horas).map(h=>h.dados.sono_horas);
  if(sn.length>=3){const m=sn.reduce((a,b)=>a+b,0)/sn.length;if(m<6.5)p.push(`Sono médio baixo (${m.toFixed(1)}h)`);}
  const fr={};hist.flatMap(h=>h.dados?.sintomas??[]).forEach(s=>{fr[s]=(fr[s]||0)+1;});
  Object.entries(fr).forEach(([s,n])=>{if(n>=2)p.push(`"${s}" recorrente`);});
  return p.join("; ")||null;
}

// ── VOICE ─────────────────────────────────────────────────────
let recognition=null, recTimer=null, accumulated="", recSec=0;
const voiceSupported = "SpeechRecognition" in window || "webkitSpeechRecognition" in window;

function startRec(onUpdate) {
  if (!voiceSupported) { setState({recStatus:"error",voiceErr:"Use Chrome ou Safari para gravar voz."}); return; }
  accumulated="";
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.lang="pt-BR"; recognition.continuous=true; recognition.interimResults=true;
  recognition.onresult=e=>{
    let fi="",in_="";
    for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fi+=t+" ";else in_+=t;}
    if(fi) accumulated+=fi;
    onUpdate((accumulated+in_).trim(), !!in_);
  };
  recognition.onerror=e=>{if(e.error!=="no-speech"){setState({recStatus:"error",voiceErr:"Verifique a permissão do microfone."});}};
  recognition.onend=()=>{if(recognition){onUpdate(accumulated.trim(),false);setState({recStatus:"idle",recSec:0});recognition=null;clearInterval(recTimer);}};
  recognition.start(); recSec=0;
  recTimer=setInterval(()=>{recSec++;setState({recSec});},1000);
  setState({recStatus:"recording",recSec:0,voiceErr:""});
}

function stopRec(onUpdate) {
  if(recognition){recognition.stop();recognition=null;}
  clearInterval(recTimer); onUpdate(accumulated.trim(),false);
  setState({recStatus:"idle",recSec:0});
}

function resetRec() {
  if(recognition){recognition.stop();recognition=null;}
  clearInterval(recTimer); accumulated="";
  setState({recStatus:"idle",recSec:0,voiceErr:"",texto:"",isInterim:false});
}

// ── DOM HELPERS ───────────────────────────────────────────────
function h(tag, attrs, ...kids) {
  const e=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(k==="class") e.className=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(["value","placeholder","type","rows","min","max","step","disabled","checked"].includes(k)){
      if(k==="disabled"||k==="checked"){if(v)e[k]=true;}
      else e[k]=v;
    }
    else e.setAttribute(k,v);
  });
  kids.flat(9).forEach(c=>{ if(c==null||c===false)return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
const d  = (s,...c) => h("div",{style:s},...c);
const sp = (s,...c) => h("span",{style:s},...c);
const bt = (s,label,onClick,disabled) => h("button",{style:s,onClick,disabled},label);
const inp= (v,s,onChange,extra={}) => {
  const e=h("input",{type:"text",value:v,style:s,onChange:null,...extra});
  if(onChange) e.addEventListener("input",ev=>onChange(ev.target.value));
  return e;
};
const ta = (v,s,onChange,ph,rows=3) => {
  const e=h("textarea",{style:s,placeholder:ph,rows});
  e.value=v;
  e.addEventListener("input",ev=>onChange(ev.target.value));
  return e;
};

            sp({color:"#fff"},"d"),sp({color:cor},"IA"),sp({color:"#fff"},"rio")
          ),
          d({fontSize:"10px",color:"rgba(255,255,255,0.28)",marginTop:"3px",fontFamily:"monospace",letterSpacing:"0.08em"},
            `${p.nome.toUpperCase()} · ${S.checkins.length} registro${S.checkins.length!==1?"s":""}`)
        )
      ),
      d({display:"flex",gap:"7px"},
        ...["form","historico"].map(f=>
          bt({background:(S.fase===f||(f==="form"&&S.fase==="insight"))?`${cor}25`:"transparent",
              border:`1px solid ${(S.fase===f||(f==="form"&&S.fase==="insight"))?`${cor}80`:"rgba(255,255,255,0.12)"}`,
              borderRadius:"20px",padding:"5px 12px",color:cor,fontSize:"11px",fontWeight:"500"},
            f==="form"?"check-in":"histórico",()=>f==="form"?resetForm():setState({fase:f}))
        ),
        bt({background:"transparent",border:`1px solid rgba(255,255,255,0.1)`,borderRadius:"20px",padding:"5px 10px",color:C.faint,fontSize:"11px"},
          "↩",()=>setState({screen:"select",fase:"form"}))
      )
    )
  );

  let content;

  // LOADING
  if(S.fase==="loading") {
    content=d({textAlign:"center",padding:"72px 0"},
      d({width:"44px",height:"44px",borderRadius:"50%",border:`3px solid ${cor}20`,borderTop:`3px solid ${cor}`,margin:"0 auto 20px",animation:"spin 0.9s linear infinite"}),
      d({color:C.muted,fontSize:"14px"},S.loadMsg)
    );
  }

  // FORM
  else if(S.fase==="form") {
    const toggle=d({display:"flex",gap:"8px"},
      ...["manha","noite"].map(m=>
        bt({flex:"1",padding:"12px 0",borderRadius:"12px",background:S.momento===m?`${cor}20`:C.sf,
            border:`1.5px solid ${S.momento===m?cor:C.bd}`,color:S.momento===m?cor:C.muted,
            fontSize:"14px",fontWeight:"500",opacity:jaFezHoje(m)?0.45:1,transition:"all 0.2s"},
          `${m==="manha"?"🌤 manhã":"🌙 noite"}${jaFezHoje(m)?" ✓":""}`,()=>setState({momento:m}))
      )
    );

    const roteiro=d({background:`${cor}0C`,border:`1px solid ${cor}28`,borderRadius:"14px",padding:"14px 16px"},
      d({fontSize:"10px",color:cor,marginBottom:"10px",letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"monospace"},
        S.momento==="manha"?"roteiro · manhã":"roteiro · noite"),
      ...ROTEIRO[S.momento].map((q,i)=>
        d({display:"flex",gap:"10px",marginBottom:i<ROTEIRO[S.momento].length-1?"8px":"0"},
          d({fontSize:"11px",color:`${cor}90`,fontFamily:"monospace",marginTop:"1px",flexShrink:"0"},`${i+1}.`),
          d({fontSize:"13px",color:C.muted,lineHeight:"1.55"},q)
        )
      )
    );

    // Mic
    const micBtn=h("button",{
      style:{width:"80px",height:"80px",borderRadius:"50%",border:"none",cursor:voiceSupported?"pointer":"not-allowed",
        background:isRec?C.gradRec:`linear-gradient(135deg,${cor}99,${cor})`,
        boxShadow:isRec?"0 0 0 10px rgba(196,64,74,0.12),0 0 0 20px rgba(196,64,74,0.05)":`0 8px 32px ${cor}66`,
        transition:"all 0.3s",display:"flex",alignItems:"center",justifyContent:"center"},
      onClick:()=>isRec?stopRec(onTranscript):startRec(onTranscript)
    }, isRec
      ? h("svg",{width:"22",height:"22",viewBox:"0 0 20 20",fill:"white"},h("rect",{x:"3",y:"3",width:"14",height:"14",rx:"2.5"}))
      : h("svg",{width:"26",height:"26",viewBox:"0 0 24 24",fill:"none",stroke:"white","stroke-width":"2.2","stroke-linecap":"round"},
          h("path",{d:"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"}),
          h("path",{d:"M19 10v2a7 7 0 0 1-14 0v-2"}),
          h("line",{x1:"12",y1:"19",x2:"12",y2:"23"}),
          h("line",{x1:"8",y1:"23",x2:"16",y2:"23"})
        )
    );

    const painelVoz=d({background:C.sf,border:`1.5px solid ${isRec?"rgba(196,64,74,0.5)":S.texto?cor+"80":C.bd}`,borderRadius:"18px",padding:"20px 18px",transition:"border-color 0.3s"},
      d({fontSize:"10px",color:C.faint,marginBottom:"18px",letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"monospace"},
        S.momento==="manha"?"como foi a noite e como você acordou?":"como foi o dia?"),
      d({display:"flex",justifyContent:"center",marginBottom:"10px"},micBtn),
      d({textAlign:"center",fontSize:"12px",color:isRec?C.red:C.muted,fontFamily:"monospace",letterSpacing:"0.06em",height:"18px",marginBottom:"14px"},
        isRec?`⏺ ${fmt(S.recSec||0)}`:voiceSupported?"toque para gravar":"use o texto abaixo"),
      (S.texto||isRec)?d({background:`${cor}10`,border:`1px solid ${cor}28`,borderRadius:"12px",padding:"12px 14px",marginBottom:"14px",minHeight:"48px"},
        d({fontSize:"13px",lineHeight:"1.65",color:S.isInterim?C.muted:C.text,fontStyle:S.isInterim?"italic":"normal"},S.texto||"ouvindo…")
      ):null,
      d({display:"flex",alignItems:"center",gap:"10px",marginBottom:"12px"},
        d({flex:"1",height:"1px",background:C.bd}),
        sp({fontSize:"10px",color:C.faint,fontFamily:"monospace",letterSpacing:"0.08em"},"ou escreva"),
        d({flex:"1",height:"1px",background:C.bd})
      ),
      ta(S.texto,{width:"100%",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.bd}`,borderRadius:"10px",padding:"10px 12px",color:C.text,fontSize:"14px",resize:"vertical",outline:"none",lineHeight:"1.6",boxSizing:"border-box"},
        v=>setState({texto:v,isInterim:false}),
        S.momento==="manha"?"fale ou escreva livremente…":"o saldo do dia, como você está agora…"),
      S.voiceErr?d({fontSize:"12px",color:C.red,marginTop:"8px"},`⚠ ${S.voiceErr}`):null
    );

    // Campos opcionais
    let campos;
    if(S.momento==="manha") {
      const sI=h("input",{type:"number",min:"0",max:"12",step:"0.5",placeholder:"ex: 7",
        style:{width:"100%",background:"rgba(255,255,255,0.06)",border:`1px solid ${C.bd}`,borderRadius:"8px",padding:"9px 12px",color:C.text,fontSize:"14px",boxSizing:"border-box",outline:"none"}});
      sI.value=S.sono; sI.addEventListener("input",e=>setState({sono:e.target.value}));
      const sS=h("input",{type:"text",placeholder:"ex: dor de cabeça",
        style:{width:"100%",background:"rgba(255,255,255,0.06)",border:`1px solid ${C.bd}`,borderRadius:"8px",padding:"9px 12px",color:C.text,fontSize:"14px",boxSizing:"border-box",outline:"none"}});
      sS.value=S.sintomaManha; sS.addEventListener("input",e=>setState({sintomaManha:e.target.value}));
      campos=d({display:"flex",flexDirection:"column",gap:"14px"},
        d({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"},
          d({},d({fontSize:"12px",color:C.muted,marginBottom:"6px"},"😴 sono (horas)"),sI),
          d({},d({fontSize:"12px",color:C.muted,marginBottom:"6px"},"🤒 sintoma ao acordar"),sS)
        ),
        d({},
          d({fontSize:"12px",color:C.muted,marginBottom:"8px"},"qualidade do sono"),
          d({display:"flex",gap:"6px"},
            ...SONO_OPTS.map((l,i)=>bt({flex:"1",padding:"7px 0",borderRadius:"8px",
                background:S.sonoQ===i+1?`${cor}30`:"rgba(255,255,255,0.04)",
                border:`1px solid ${S.sonoQ===i+1?cor:C.bd}`,
                color:S.sonoQ===i+1?cor:C.faint,fontSize:"11px",fontWeight:S.sonoQ===i+1?"600":"400"},l,()=>setState({sonoQ:i+1})))
          )
        )
      );
    } else {
      const sN=h("input",{type:"text",placeholder:"ex: dor de cabeça, cansaço fora do comum…",
        style:{width:"100%",background:"rgba(255,255,255,0.06)",border:`1px solid ${C.bd}`,borderRadius:"8px",padding:"9px 12px",color:C.text,fontSize:"14px",boxSizing:"border-box",outline:"none"}});
      sN.value=S.sintomaNoite; sN.addEventListener("input",e=>setState({sintomaNoite:e.target.value}));
      campos=d({display:"flex",flexDirection:"column",gap:"14px"},
        d({},
          d({fontSize:"12px",color:C.muted,marginBottom:"10px"},"⚡ como variou sua energia hoje"),
          d({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"},
            d({},d({fontSize:"11px",color:C.faint,marginBottom:"6px",fontFamily:"monospace"},"de manhã"),
              d({display:"flex",gap:"5px"},...[1,2,3,4,5].map(n=>bt({flex:"1",height:"28px",borderRadius:"6px",background:S.enI>=n?`${cor}35`:"rgba(255,255,255,0.04)",border:`1px solid ${S.enI>=n?cor:C.bd}`,color:S.enI>=n?cor:C.faint,fontSize:"12px",fontWeight:"600"},String(n),()=>setState({enI:n}))))),
            d({},d({fontSize:"11px",color:C.faint,marginBottom:"6px",fontFamily:"monospace"},"agora / à noite"),
              d({display:"flex",gap:"5px"},...[1,2,3,4,5].map(n=>bt({flex:"1",height:"28px",borderRadius:"6px",background:S.enF>=n?`${cor}35`:"rgba(255,255,255,0.04)",border:`1px solid ${S.enF>=n?cor:C.bd}`,color:S.enF>=n?cor:C.faint,fontSize:"12px",fontWeight:"600"},String(n),()=>setState({enF:n})))))
          )
        ),
        d({},d({fontSize:"12px",color:C.muted,marginBottom:"8px"},"saldo de humor do dia"),
          d({display:"flex",gap:"6px"},...HUMORES.map((e,i)=>bt({flex:"1",height:"36px",borderRadius:"8px",fontSize:"20px",background:S.humor===i+1?`${cor}22`:"rgba(255,255,255,0.04)",border:`1px solid ${S.humor===i+1?cor:C.bd}`},e,()=>setState({humor:i+1}))))
        ),
        d({},d({fontSize:"12px",color:C.muted,marginBottom:"8px"},"🥗 alimentação hoje"),
          d({display:"flex",gap:"6px"},...ALIM_OPTS.map(a=>bt({flex:"1",padding:"7px 0",borderRadius:"8px",background:S.alim===a?`${cor}25`:"rgba(255,255,255,0.04)",border:`1px solid ${S.alim===a?cor:C.bd}`,color:S.alim===a?cor:C.faint,fontSize:"12px",fontWeight:S.alim===a?"600":"400"},a,()=>setState({alim:a}))))
        ),
        d({},d({fontSize:"12px",color:C.muted,marginBottom:"6px"},"🤒 algum sintoma hoje"),sN)
      );
    }

    const camposBox=d({background:C.sf,border:`1px solid ${C.bd}`,borderRadius:"14px",padding:"16px"},
      d({fontSize:"10px",color:C.faint,marginBottom:"14px",letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"monospace"},
        S.momento==="manha"?"dados da noite":"dados do dia"),
      campos
    );

    content=d({display:"flex",flexDirection:"column",gap:"14px"},
      toggle, roteiro, painelVoz, camposBox,
      bt({padding:"14px 0",borderRadius:"14px",border:"none",background:S.texto.trim()?`linear-gradient(135deg,${cor}99,${cor})`:"rgba(255,255,255,0.06)",color:S.texto.trim()?"#fff":C.faint,fontSize:"15px",fontWeight:"600",width:"100%",transition:"all 0.2s"},
        "enviar check-in",handleSubmit,!S.texto.trim()),
      S.checkins.length>=4?bt({padding:"12px 0",borderRadius:"14px",background:`${cor}10`,border:`1px solid ${cor}40`,color:cor,fontSize:"14px",fontWeight:"500",width:"100%"},
        `✦ análise da semana · ${S.checkins.length} registros`,handleAnalise):null
    );
  }

  // INSIGHT
  else if(S.fase==="insight") {
    content=d({display:"flex",flexDirection:"column",gap:"14px",class:"fade"},
      d({background:`linear-gradient(135deg,${cor}18,${cor}06)`,border:`1px solid ${cor}30`,borderRadius:"20px",padding:"28px 22px"},
        d({fontSize:"10px",color:cor,letterSpacing:"0.12em",textTransform:"uppercase",fontFamily:"monospace",marginBottom:"16px"},
          S.momento==="manha"?"🌤 bom dia":"🌙 boa noite"),
        d({fontSize:"17px",lineHeight:"1.78",color:C.text},S.insight)
      ),
      d({display:"flex",gap:"10px"},
        bt({flex:"1",padding:"12px 0",borderRadius:"12px",background:C.sf,border:`1px solid ${C.bd}`,color:C.muted,fontSize:"14px"},"novo check-in",resetForm),
        bt({flex:"1",padding:"12px 0",borderRadius:"12px",background:`${cor}12`,border:`1px solid ${cor}40`,color:cor,fontSize:"14px"},"ver histórico",()=>setState({fase:"historico"}))
      )
    );
  }

  // ANÁLISE
  else if(S.fase==="analise") {
    content=d({display:"flex",flexDirection:"column",gap:"14px",class:"fade"},
      d({background:`linear-gradient(135deg,rgba(26,16,64,0.9),${cor}20)`,border:`1px solid ${cor}40`,borderRadius:"20px",padding:"28px 22px"},
        d({fontSize:"10px",color:cor,letterSpacing:"0.12em",textTransform:"uppercase",fontFamily:"monospace",marginBottom:"16px"},`✦ reflexão da semana · ${p.nome}`),
        d({fontSize:"16px",lineHeight:"1.8",color:C.text},S.analise)
      ),
      bt({padding:"12px 0",borderRadius:"12px",background:C.sf,border:`1px solid ${C.bd}`,color:C.muted,fontSize:"14px",width:"100%"},"voltar",resetForm)
    );
  }

  // HISTÓRICO
  else if(S.fase==="historico") {
    const dias=[...new Set(S.checkins.map(c=>c.data))].sort().slice(-7);
    const cal=d({display:"flex",gap:"6px",padding:"14px 16px",background:C.sf,borderRadius:"14px",border:`1px solid ${C.bd}`,marginBottom:"4px"},
      ...dias.map(d_=>{
        const m=S.checkins.find(c=>c.data===d_&&c.momento==="manha");
        const n=S.checkins.find(c=>c.data===d_&&c.momento==="noite");
        return d({flex:"1",textAlign:"center"},
          d({fontSize:"10px",color:d_===today()?cor:C.faint,marginBottom:"5px",fontFamily:"monospace"},wday(d_)),
          d({display:"flex",flexDirection:"column",gap:"3px"},
            d({height:"5px",borderRadius:"3px",background:m?cor:"rgba(255,255,255,0.07)"}),
            d({height:"5px",borderRadius:"3px",background:n?`${cor}88`:"rgba(255,255,255,0.07)"})
          )
        );
      })
    );
    const items=[...S.checkins].reverse().map(c=>
      d({background:C.sf,border:`1px solid ${C.bd}`,borderRadius:"14px",padding:"14px 16px"},
        d({display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"},
          d({fontSize:"11px",color:cor,fontFamily:"monospace"},`${fmtDate(c.data)} · ${c.momento==="manha"?"🌤 manhã":"🌙 noite"}`),
          d({display:"flex",gap:"8px",fontSize:"12px",color:C.muted},
            c.momento==="manha"&&c.dados?.sono_horas?`😴 ${c.dados.sono_horas}h`:"",
            c.momento==="noite"&&c.dados?.energia_inicio?`⚡ ${c.dados.energia_inicio}→${c.dados.energia_fim??"?"}`:"",
            c.dados?.humor?HUMORES[HUMOR_LABEL.indexOf(c.dados.humor)]??"😐":""
          )
        ),
        d({fontSize:"13px",color:"rgba(255,255,255,0.42)",lineHeight:"1.55",fontStyle:"italic"},`"${c.texto_original}"`),
        ...(c.dados?.sintomas??[]).length>0?[
          d({marginTop:"8px",display:"flex",gap:"5px",flexWrap:"wrap"},
            ...(c.dados.sintomas).map(s=>d({fontSize:"11px",background:`${cor}20`,color:cor,borderRadius:"20px",padding:"2px 10px"},s)))
        ]:[]
      )
    );
    content=d({display:"flex",flexDirection:"column",gap:"12px"},
      S.checkins.length===0?d({textAlign:"center",padding:"56px 0",color:C.faint,fontSize:"14px"},"nenhum check-in ainda."):null,
      dias.length>0?cal:null,...items,
      bt({padding:"13px 0",borderRadius:"14px",background:`linear-gradient(135deg,${cor}80,${cor})`,border:"none",color:"#fff",fontSize:"14px",fontWeight:"600",marginTop:"4px",width:"100%"},"novo check-in",resetForm),
      S.checkins.length>=4?bt({padding:"12px 0",borderRadius:"14px",background:`${cor}10`,border:`1px solid ${cor}40`,color:cor,fontSize:"14px",width:"100%"},"✦ análise da semana",handleAnalise):null
    );
  }

  return d({minHeight:"100vh",background:C.bg,color:C.text},
    header,
    d({maxWidth:"460px",margin:"0 auto",padding:"20px 18px 60px"},content)
  );
}

// ── LOGO HELPER ───────────────────────────────────────────────
function logoBlock(sub) {
  return d({marginBottom:"32px",textAlign:"center"},
    d({fontSize:"32px",fontWeight:"700",letterSpacing:"-0.03em",marginBottom:"8px"},
      sp({color:"rgba(255,255,255,0.28)",fontWeight:"300"},"meu"),
      sp({color:"#fff"},"d"),sp({color:C.lav},"IA"),sp({color:"#fff"},"rio")
    ),
    d({fontSize:"13px",color:C.faint,fontFamily:"monospace",letterSpacing:"0.08em"},sub)
  );
}

// ── AÇÕES ─────────────────────────────────────────────────────
function resetForm() {
  resetRec();
  setState({fase:"form",insight:"",analise:"",texto:"",isInterim:false,
    sono:"",sonoQ:0,sintomaManha:"",enI:0,enF:0,humor:0,alim:"",sintomaNoite:""});
}

async function handleSubmit() {
  if(!S.texto.trim()) return;
  if(S.recStatus==="recording") stopRec(t=>setState({texto:t,isInterim:false}));
  setState({fase:"loading",loadMsg:"Processando seu check-in…"});

  const extras=S.momento==="manha"
    ?{sono_horas:S.sono||null,sono_q:S.sonoQ||null,sintoma:S.sintomaManha||null}
    :{energia_i:S.enI||null,energia_f:S.enF||null,humor:S.humor?HUMOR_LABEL[S.humor-1]:null,alim:S.alim||null,sintoma:S.sintomaNoite||null};

  let dados={};
  try {
    setState({loadMsg:"Entendendo o que você disse…"});
    const raw=await callClaude(buildExtractor(S.texto,S.momento,extras));
    dados=JSON.parse(raw.replace(/```json|```/g,"").trim());
  } catch {
    dados={...extras,nota_livre:S.texto,contexto_momento:S.momento,sintomas:extras.sintoma?[extras.sintoma]:[]};
  }

  const novo={id:Date.now(),data:today(),momento:S.momento,texto_original:S.texto,dados};
  const lista=[...S.checkins,novo];
  saveCheckins(S.activeProfile.id,lista);

  setState({loadMsg:"Preparando seu insight…"});
  const hist=lista.slice(-14).filter(c=>c.id!==novo.id);
  try {
    const ins=await callClaude(buildInsight(dados,hist,S.activeProfile.nome,S.momento));
    setState({checkins:lista,insight:ins,fase:"insight"});
  } catch(e) {
    setState({checkins:lista,insight:"Erro ao gerar insight. Verifique sua API key.",fase:"insight"});
  }
}

async function handleAnalise() {
  setState({fase:"loading",loadMsg:"Analisando sua semana…"});
  try {
    const r=await callClaude(buildAnalise(S.checkins.slice(-14),S.activeProfile.nome));
    setState({analise:r,fase:"analise"});
  } catch {
    setState({analise:"Erro ao gerar análise. Verifique sua API key.",fase:"analise"});
  }
}

// ── RENDER ────────────────────────────────────────────────────
function render() {
  const root=document.getElementById("root");
  root.innerHTML="";
  let node;
  if(S.screen==="setup") node=renderSetup();
  else if(S.screen==="select") node=renderSelect();
  else if(S.screen==="newprofile") node=renderNewProfile();
  else node=renderApp();
  root.appendChild(node);
}

// ── INIT ──────────────────────────────────────────────────────
const hasKey=!!localStorage.getItem(SK_APIKEY);
S.profiles=loadProfiles();
S.screen=hasKey?"select":"setup";
render();
</script>
